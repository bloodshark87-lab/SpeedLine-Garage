<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedLine Garage — Вход</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        eruda.init({
            tool: ['console', 'elements', 'network', 'resources', 'sources', 'info'],
            useShadowDom: true
        });
        eruda.hide();
        
        function toggleEruda() {
            const el = document.getElementById('eruda-container');
            if (el && el.style.display !== 'none') {
                eruda.hide();
            } else {
                eruda.show();
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-sub {
            font-size: 0.65rem;
            color: #94a3b8;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.5; cursor: default; }

        .btn-setup {
            width: 100%;
            padding: 10px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
            border-radius: 10px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-setup:hover { background: rgba(245, 158, 11, 0.25); }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show { display: block; }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }

        .success-message.show { display: block; }

        .setup-hint {
            text-align: center;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 16px;
            line-height: 1.5;
        }

        .debug-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .debug-btn:hover {
            background: rgba(239, 68, 68, 0.5);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://qtkbqqnfuwzqytssxmah.supabase.co/storage/v1/object/public/Logo/IMG_20260729_174121.jpg" alt="Logo" class="logo-img">
            <div class="logo-text">SpeedLine Garage</div>
            <div class="logo-sub">доска мастера</div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="loginUsername" placeholder="Введите логин" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Войти</button>
        </form>

        <button class="btn-setup" id="setupAdminBtn">Создать админа (yura / yura1987)</button>

        <div class="setup-hint">
            Стандартный вход:<br>
            <strong>yura / yura1987</strong>
        </div>
    </div>

    <button class="debug-btn" onclick="toggleEruda()" title="Консоль отладки">🐛</button>

    <script>
        const SUPABASE_URL = 'https://qtkbqqnfuwzqytssxmah.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0a2JxcW5mdXd6cXl0c3N4bWFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjMwMDMsImV4cCI6MjEwMDg5OTAwM30.YSE_kDwabkvAnOrq4lP1pofJTAtwao36cZde0kiUmFM';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        const loginBtn = document.getElementById('loginBtn');

        async function checkSession() {
            const { data: { session } } = await client.auth.getSession();
            if (session) window.location.href = 'index.html';
        }
        checkSession();

        // Кнопка создания админа
        document.getElementById('setupAdminBtn').addEventListener('click', async () => {
            const btn = document.getElementById('setupAdminBtn');
            btn.disabled = true;
            btn.textContent = 'Создаю...';
            hideMessages();

            const { error } = await client.auth.signUp({
                email: 'yura@speedline.local',
                password: 'yura1987',
                options: {
                    data: { role: 'admin', username: 'yura' }
                }
            });

            if (error) {
                if (error.message.includes('already registered') || error.message.includes('already exists')) {
                    showSuccess('Администратор уже создан! Войдите: yura / yura1987');
                } else {
                    showError('Ошибка: ' + error.message);
                }
            } else {
                showSuccess('Администратор создан! Войдите: yura / yura1987');
            }

            btn.disabled = false;
            btn.textContent = 'Создать админа (yura / yura1987)';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) { showError('Заполните все поля'); return; }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';
            hideMessages();

            const email = `${username.toLowerCase()}@speedline.local`;
            const { data, error } = await client.auth.signInWithPassword({ email, password });

            if (error) {
                showError('Неверный логин или пароль');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            } else {
                localStorage.setItem('userRole', data.user?.user_metadata?.role || 'master');
                localStorage.setItem('username', username);
                window.location.href = 'index.html';
            }
        });

        function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('show'); successMsg.classList.remove('show'); }
        function showSuccess(msg) { successMsg.textContent = msg; successMsg.classList.add('show'); errorMsg.classList.remove('show'); }
        function hideMessages() { errorMsg.classList.remove('show'); successMsg.classList.remove('show'); }
    </script>
</body>
</html>
