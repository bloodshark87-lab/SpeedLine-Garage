<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>SpeedLine Garage 2.0 — Доска мастера</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
         eruda.init({
    tool: ['console', 'elements', 'network', 'resources', 'sources', 'info'],
    useShadowDom: true
});
eruda.hide();       
        function toggleEruda() {
            const el = document.getElementById('eruda-container');
            if (el && el.style.display !== 'none') {
                eruda.hide();
            } else {
                eruda.show();
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-primary: #050510;
            --bg-secondary: rgba(8, 12, 28, 0.7);
            --bg-card: rgba(8, 12, 28, 0.5);
            --border: rgba(0, 240, 255, 0.12);
            --text-primary: #e0f7ff;
            --text-secondary: #6b7a94;
            --accent: #ff2a6d;
            --success: #00ff88;
            --warning: #ffae00;
            --info: #00f0ff;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff2a6d;
            --neon-amber: #ffae00;
            --radius-lg: 2px;
            --radius-md: 2px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-hud: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --glass-bg: rgba(8, 12, 28, 0.6);
            --glass-border: rgba(0, 240, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 0;
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            position: relative;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* === CYBERPUNK BACKGROUND EFFECTS === */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 4s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.2) 2px,
                rgba(0, 0, 0, 0.2) 4px
            );
            pointer-events: none;
            z-index: 9999;
            opacity: 0.25;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; text-shadow: 0 0 10px currentColor; }
            20%, 24%, 55% { opacity: 0.6; text-shadow: none; }
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseGlowCyan {
            0%, 100% { box-shadow: 0 0 5px var(--neon-cyan), 0 0 15px rgba(0, 240, 255, 0.2); }
            50% { box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px rgba(0, 240, 255, 0.4); }
        }

        @keyframes pulseGlowPink {
            0%, 100% { box-shadow: 0 0 5px var(--neon-pink), 0 0 15px rgba(255, 42, 109, 0.2); }
            50% { box-shadow: 0 0 15px var(--neon-pink), 0 0 30px rgba(255, 42, 109, 0.4); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        /* === MAIN CONTAINER === */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            min-height: 100vh;
            border-left: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 0 80px rgba(0, 240, 255, 0.06),
                inset 0 0 80px rgba(0, 0, 0, 0.6);
        }

        .container::before,
        .container::after {
            content: '◢';
            position: absolute;
            font-size: 14px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            z-index: 10;
        }

        .container::before {
            top: 8px; left: 8px;
            transform: rotate(0deg);
        }

        .container::after {
            bottom: 8px; right: 8px;
            transform: rotate(180deg);
        }

        @media (min-width: 768px) {
            .container { 
                margin: 10px auto; 
                min-height: calc(100vh - 20px); 
                border: 1px solid var(--glass-border);
            }
        }

        /* === HEADER === */
        .header {
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(20px);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid transparent;
            border-image: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink), transparent) 1;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.6), 0 2px 20px rgba(0, 240, 255, 0.1);
        }

        .logo-area { display: flex; align-items: center; flex: 1; }

        .logo-img { 
            width: 42px; 
            height: 42px; 
            border-radius: 4px; 
            object-fit: cover; 
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.2); 
            border: 1px solid rgba(0, 240, 255, 0.4);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .company-name { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: #ffffff; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            font-family: var(--font-hud);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .company-subtitle { 
            font-size: 0.65rem; 
            color: var(--neon-cyan); 
            letter-spacing: 3px; 
            text-transform: uppercase;
            font-family: var(--font-mono);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
            animation: neonFlicker 3s infinite;
        }

        .header-right { display: flex; align-items: center; gap: 12px; }

        .user-info { 
            font-size: 0.75rem; 
            color: var(--text-secondary);
            font-family: var(--font-mono);
            letter-spacing: 1px;
        }

        .btn-logout { 
            background: rgba(255, 42, 109, 0.1); 
            border: 1px solid rgba(255, 42, 109, 0.4); 
            color: var(--neon-pink); 
            padding: 8px 16px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 0.7rem; 
            font-weight: 600; 
            transition: var(--transition);
            font-family: var(--font-hud);
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.5);
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.1);
        }

        .btn-logout:hover { 
            background: rgba(255, 42, 109, 0.25); 
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.3);
            text-shadow: 0 0 15px rgba(255, 42, 109, 0.8);
            transform: translateY(-1px);
        }

        .sync-badge { 
            font-size: 0.7rem; 
            padding: 6px 14px; 
            border-radius: 2px; 
            background: rgba(0, 255, 136, 0.08); 
            color: var(--success); 
            border: 1px solid rgba(0, 255, 136, 0.3); 
            transition: var(--transition); 
            white-space: nowrap;
            font-family: var(--font-mono);
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.05);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        .sync-badge.error { 
            background: rgba(255, 42, 109, 0.08); 
            color: var(--neon-pink); 
            border-color: rgba(255, 42, 109, 0.3);
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.4);
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.05);
        }

        /* === SEARCH === */
        .search-container { 
            padding: 14px 18px; 
            background: rgba(5, 5, 16, 0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid var(--glass-border); 
            position: sticky; 
            top: 65px; 
            z-index: 99;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .search-wrapper { position: relative; }

        .search-icon { 
            position: absolute; 
            left: 14px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--neon-cyan); 
            font-size: 1.1rem; 
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.4));
        }

        .search-input { 
            width: 100%; 
            padding: 12px 16px 12px 44px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(0, 240, 255, 0.2); 
            border-radius: 2px; 
            color: var(--text-primary); 
            font-size: 0.95rem; 
            transition: var(--transition);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 240, 255, 0.05);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            font-family: var(--font-body);
        }

        .search-input:focus { 
            outline: none; 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.2), 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.5);
        }

        /* === ADD BUTTON === */
        .add-btn-container { 
            padding: 10px 18px; 
            position: sticky; 
            top: 128px; 
            z-index: 98; 
            background: rgba(5, 5, 16, 0.9); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        .add-btn { 
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.8), rgba(255, 42, 109, 0.8)); 
            color: #fff; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 2px; 
            font-size: 0.9rem; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), 0 0 40px rgba(255, 42, 109, 0.2); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            width: 100%; 
            transition: var(--transition);
            font-family: var(--font-hud);
            letter-spacing: 2px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .add-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .add-btn:hover::before {
            left: 100%;
        }

        .add-btn:hover {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5), 0 0 60px rgba(255, 42, 109, 0.3);
            transform: translateY(-2px);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .add-btn:active { transform: scale(0.98) translateY(0); }

        /* === CARDS LIST === */
        .cards-list { 
            padding: 10px 18px 18px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            flex: 1; 
            overflow-y: auto;
        }

        /* === COMPACT CARD === */
        .compact-card { 
            background: var(--glass-bg); 
            border-radius: 2px; 
            padding: 14px 16px; 
            border: 1px solid var(--glass-border); 
            cursor: pointer; 
            transition: var(--transition); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            min-height: 64px; 
            backdrop-filter: blur(15px); 
            user-select: none;
            position: relative;
            overflow: hidden;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 10px rgba(0, 240, 255, 0.05);
        }

        .compact-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.5;
        }

        .compact-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4), 0 0 25px rgba(0, 240, 255, 0.15);
            transform: translateX(4px);
        }

        .compact-card:active { transform: scale(0.99) translateX(2px); }

        .compact-card.expanded { 
            border-color: var(--neon-pink); 
            box-shadow: 0 0 0 1px rgba(255, 42, 109, 0.3), 0 0 30px rgba(255, 42, 109, 0.15);
            animation: pulseGlowPink 2s infinite;
        }

        .compact-card.expanded::before {
            background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
        }

        .car-icon { 
            font-size: 2rem; 
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        }

        .compact-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

        .compact-primary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .compact-car { 
            font-weight: 700; 
            color: var(--text-primary); 
            font-size: 0.95rem;
            font-family: var(--font-hud);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(224, 247, 255, 0.3);
        }

        .compact-plate { 
            background: rgba(0, 240, 255, 0.1); 
            padding: 3px 10px; 
            border-radius: 2px; 
            font-weight: 700; 
            font-size: 0.8rem; 
            letter-spacing: 2px; 
            color: var(--neon-cyan); 
            border: 1px solid rgba(0, 240, 255, 0.3);
            font-family: var(--font-mono);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }

        .compact-secondary { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            flex-wrap: wrap; 
            font-size: 0.8rem; 
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .compact-client { 
            color: #a0c4e8; 
            font-weight: 600;
            text-shadow: 0 0 5px rgba(160, 196, 232, 0.2);
        }

        .compact-date { color: var(--text-secondary); }

        .compact-visits { 
            color: var(--neon-amber); 
            font-weight: 700; 
            font-size: 0.8rem;
            text-shadow: 0 0 8px rgba(255, 174, 0, 0.4);
        }

        .status-badge { 
            padding: 4px 12px; 
            border-radius: 2px; 
            font-size: 0.65rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            flex-shrink: 0; 
            white-space: nowrap;
            font-family: var(--font-hud);
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
            text-shadow: 0 0 8px currentColor;
        }

        .status-in_progress { 
            background: rgba(0, 255, 136, 0.1); 
            color: var(--success); 
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        .status-waiting_parts { 
            background: rgba(255, 174, 0, 0.1); 
            color: var(--neon-amber); 
            border: 1px solid rgba(255, 174, 0, 0.3);
            box-shadow: 0 0 10px rgba(255, 174, 0, 0.1);
        }

        .status-ready { 
            background: rgba(0, 240, 255, 0.1); 
            color: var(--neon-cyan); 
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .status-completed { 
            background: rgba(139, 122, 148, 0.1); 
            color: #8b9bb4; 
            border: 1px solid rgba(139, 122, 148, 0.3);
        }

        .status-paused { 
            background: rgba(255, 42, 109, 0.1); 
            color: var(--neon-pink); 
            border: 1px solid rgba(255, 42, 109, 0.3);
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.1);
        }

        .expand-arrow { 
            color: var(--neon-cyan); 
            font-size: 1.1rem; 
            transition: transform 0.3s ease; 
            flex-shrink: 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.3));
        }

        .compact-card.expanded .expand-arrow { transform: rotate(180deg); }

        /* === EXPANDED CONTENT === */
        .expanded-content { 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border); 
            border-top: none; 
            border-radius: 0 0 2px 2px; 
            padding: 18px; 
            margin-top: -1px; 
            display: none; 
            flex-direction: column; 
            gap: 18px; 
            backdrop-filter: blur(20px);
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 0 40px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .expanded-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
            opacity: 0.6;
        }

        .compact-card.expanded + .expanded-content { display: flex; }

        .card-wrapper { display: flex; flex-direction: column; }

        /* === INFO SECTION === */
        .info-section { 
            background: rgba(0, 0, 0, 0.25); 
            border: 1px solid var(--glass-border); 
            border-radius: 2px; 
            padding: 16px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 240, 255, 0.05);
        }

        .info-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 30px; height: 30px;
            border-top: 2px solid var(--neon-cyan);
            border-left: 2px solid var(--neon-cyan);
            opacity: 0.6;
        }

        .info-section::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0; width: 30px; height: 30px;
            border-bottom: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--neon-cyan);
            opacity: 0.6;
        }

        .info-section-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .info-section-title { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: var(--neon-cyan); 
            font-weight: 700;
            font-family: var(--font-hud);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .btn-edit-info { 
            background: rgba(0, 240, 255, 0.1); 
            border: 1px solid rgba(0, 240, 255, 0.3); 
            color: var(--neon-cyan); 
            padding: 8px 16px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 0.7rem; 
            font-weight: 700; 
            transition: var(--transition);
            font-family: var(--font-hud);
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .btn-edit-info:hover { 
            background: rgba(0, 240, 255, 0.2); 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
            transform: translateY(-1px);
        }

        .section-title { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: var(--neon-pink); 
            margin-bottom: 10px; 
            font-weight: 700; 
            border-bottom: 1px solid var(--glass-border); 
            padding-bottom: 8px;
            font-family: var(--font-hud);
            text-shadow: 0 0 10px rgba(255, 42, 109, 0.4);
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0;
            width: 60px; height: 1px;
            background: linear-gradient(90deg, var(--neon-pink), transparent);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .section-title.visit-section { 
            color: var(--neon-amber); 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            text-shadow: 0 0 10px rgba(255, 174, 0, 0.4);
        }

        .section-title.visit-section::after {
            background: linear-gradient(90deg, var(--neon-amber), transparent);
            box-shadow: 0 0 10px var(--neon-amber);
        }

        .field-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 4px; }

        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .field { display: flex; flex-direction: column; gap: 4px; }

        .field-label { 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            color: var(--neon-cyan); 
            font-weight: 600; 
            letter-spacing: 1px;
            font-family: var(--font-mono);
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }

        input, textarea, select { 
            width: 100%; 
            padding: 10px 14px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(0, 240, 255, 0.2); 
            border-radius: 2px; 
            color: var(--text-primary); 
            font-size: 0.9rem; 
            font-family: var(--font-mono);
            transition: var(--transition);
            letter-spacing: 0.5px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4), 0 0 5px rgba(0, 240, 255, 0.05);
        }

        input:focus, textarea:focus, select:focus { 
            outline: none; 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.2), 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        input:disabled, textarea:disabled, select:disabled { 
            opacity: 0.6; 
            background: rgba(0, 0, 0, 0.2); 
            cursor: default; 
            -webkit-text-fill-color: var(--text-primary);
            border-color: rgba(0, 240, 255, 0.1);
        }

        input[type="number"] { text-align: right; }

        textarea { resize: vertical; min-height: 60px; }

        select option {
            background: #0a0a1a;
            color: var(--text-primary);
        }

        .work-item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: rgba(0, 0, 0, 0.3); 
            padding: 10px; 
            border-radius: 2px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            transition: var(--transition);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        .work-item:hover {
            border-color: rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .work-item select { flex: 1; }

        .work-item .work-cost { width: 80px; text-align: right; }

        .remove-work-btn { 
            background: rgba(255, 42, 109, 0.15); 
            border: 1px solid rgba(255, 42, 109, 0.4); 
            color: var(--neon-pink); 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 1rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
            transition: var(--transition);
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.5);
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.1);
        }

        .remove-work-btn:hover {
            background: rgba(255, 42, 109, 0.3);
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.3);
            transform: scale(1.1);
        }

        .add-work-btn, .add-visit-btn { 
            background: rgba(0, 240, 255, 0.05); 
            border: 1px dashed rgba(0, 240, 255, 0.25); 
            color: var(--neon-cyan); 
            padding: 10px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            text-align: center; 
            transition: var(--transition);
            font-family: var(--font-hud);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        .add-work-btn:hover, .add-visit-btn:hover { 
            border-color: var(--neon-cyan); 
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        /* === VISIT BLOCK === */
        .visit-block { 
            border: 1px solid var(--glass-border); 
            border-radius: 2px; 
            overflow: hidden; 
            margin-bottom: 10px; 
            transition: var(--transition);
            background: rgba(0, 0, 0, 0.2);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .visit-block:hover {
            border-color: rgba(0, 240, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .visit-header-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 14px; 
            background: rgba(255, 174, 0, 0.05); 
            cursor: pointer; 
            user-select: none; 
            gap: 10px; 
            border-bottom: 1px solid transparent; 
            transition: var(--transition);
            position: relative;
        }

        .visit-header-row::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(180deg, var(--neon-amber), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visit-header-row:hover::before {
            opacity: 1;
        }

        .visit-header-row.expanded { 
            border-bottom-color: var(--glass-border); 
            background: rgba(255, 174, 0, 0.1);
        }

        .visit-header-row.expanded::before {
            opacity: 1;
            background: linear-gradient(180deg, var(--neon-amber), var(--neon-amber));
        }

        .visit-header-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; flex-wrap: wrap; }

        .visit-header-date { 
            font-weight: 700; 
            font-size: 0.9rem; 
            color: var(--text-primary); 
            white-space: nowrap;
            font-family: var(--font-mono);
            text-shadow: 0 0 5px rgba(224, 247, 255, 0.2);
        }

        .visit-header-mileage { 
            font-size: 0.8rem; 
            color: var(--text-secondary); 
            white-space: nowrap;
            font-family: var(--font-mono);
        }

        .visit-header-status { 
            padding: 3px 10px; 
            border-radius: 2px; 
            font-size: 0.65rem; 
            font-weight: 700; 
            white-space: nowrap;
            font-family: var(--font-hud);
            letter-spacing: 1px;
            clip-path: polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px);
            text-shadow: 0 0 5px currentColor;
        }

        .visit-header-total { 
            font-weight: 700; 
            color: var(--neon-pink); 
            font-size: 0.95rem; 
            white-space: nowrap;
            font-family: var(--font-mono);
            text-shadow: 0 0 10px rgba(255, 42, 109, 0.4);
        }

        .visit-header-arrow { 
            color: var(--neon-cyan); 
            font-size: 1.1rem; 
            transition: transform 0.3s ease; 
            flex-shrink: 0;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            filter: drop-shadow(0 0 3px rgba(0, 240, 255, 0.3));
        }

        .visit-header-row.expanded .visit-header-arrow { transform: rotate(180deg); }

        .visit-body-content { 
            display: none; 
            flex-direction: column; 
            gap: 12px; 
            padding: 14px; 
            background: rgba(0, 0, 0, 0.25);
            animation: slideIn 0.3s ease;
        }

        .visit-body-content.open { display: flex; }

        /* === INVOICE BOX === */
        .invoice-box { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(0, 240, 255, 0.2); 
            border-radius: 2px; 
            padding: 18px; 
            margin-top: 14px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 240, 255, 0.08);
        }

        .invoice-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.7;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .invoice-title { 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: var(--neon-cyan); 
            text-align: center; 
            margin-bottom: 14px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border-bottom: 1px solid rgba(0, 240, 255, 0.2); 
            padding-bottom: 10px;
            font-family: var(--font-hud);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .invoice-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.8rem; 
            margin-bottom: 10px;
            font-family: var(--font-mono);
        }

        .invoice-table th { 
            background: rgba(0, 0, 0, 0.4); 
            color: var(--neon-cyan); 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            padding: 8px 10px; 
            text-align: left; 
            border-bottom: 1px solid rgba(0, 240, 255, 0.2); 
            font-size: 0.65rem;
            font-family: var(--font-hud);
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }

        .invoice-table th:last-child { text-align: right; }

        .invoice-table td { 
            padding: 6px 10px; 
            border-bottom: 1px solid rgba(0, 240, 255, 0.05); 
            color: var(--text-primary);
            transition: background 0.2s;
        }

        .invoice-table tr:hover td {
            background: rgba(0, 240, 255, 0.03);
        }

        .invoice-table td:last-child { 
            text-align: right; 
            font-weight: 700; 
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .invoice-category-row td { 
            background: rgba(255, 174, 0, 0.08); 
            color: var(--neon-amber); 
            font-weight: 700; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            padding: 5px 10px;
            font-family: var(--font-hud);
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 174, 0, 0.3);
        }

        .invoice-total-line { 
            display: flex; 
            justify-content: space-between; 
            font-weight: 700; 
            font-size: 0.85rem; 
            padding: 5px 0; 
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        .invoice-discount-line { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.8rem; 
            color: var(--neon-amber); 
            padding: 5px 0; 
            font-weight: 700;
            font-family: var(--font-mono);
            text-shadow: 0 0 5px rgba(255, 174, 0, 0.3);
        }

        .invoice-final-line { 
            display: flex; 
            justify-content: space-between; 
            font-weight: 800; 
            font-size: 1.1rem; 
            color: var(--neon-pink); 
            border-top: 2px solid rgba(255, 42, 109, 0.3); 
            padding-top: 10px; 
            margin-top: 10px;
            font-family: var(--font-hud);
            text-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
            letter-spacing: 1px;
        }

        .discount-checkbox-wrap { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px 16px; 
            background: rgba(255, 174, 0, 0.06); 
            border-radius: 2px; 
            border: 1px solid rgba(255, 174, 0, 0.2);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        .discount-checkbox-wrap input[type="checkbox"] { 
            width: 20px; 
            height: 20px; 
            accent-color: var(--neon-amber); 
            cursor: pointer; 
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(255, 174, 0, 0.3);
        }

        .discount-checkbox-wrap label { 
            font-size: 0.85rem; 
            color: var(--neon-amber); 
            cursor: pointer; 
            font-weight: 700;
            font-family: var(--font-hud);
            text-shadow: 0 0 8px rgba(255, 174, 0, 0.3);
        }

        .btn-close-visit { 
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.8), rgba(0, 200, 100, 0.8)); 
            color: #000; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 800; 
            transition: var(--transition); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            width: 100%; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3), 0 0 40px rgba(0, 255, 136, 0.1); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            font-family: var(--font-hud);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .btn-close-visit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.5s;
        }

        .btn-close-visit:hover::before {
            left: 100%;
        }

        .btn-close-visit:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5), 0 0 60px rgba(0, 255, 136, 0.2);
            transform: translateY(-2px);
        }

        .btn-close-visit:active { transform: scale(0.97) translateY(0); }

        .btn-invoice-toggle { 
            background: rgba(0, 240, 255, 0.1); 
            border: 1px solid rgba(0, 240, 255, 0.3); 
            color: var(--neon-cyan); 
            padding: 12px 18px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 0.8rem; 
            font-weight: 700; 
            transition: var(--transition); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            width: 100%;
            font-family: var(--font-hud);
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .btn-invoice-toggle:hover { 
            background: rgba(0, 240, 255, 0.2); 
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
            transform: translateY(-1px);
        }

        .btn-pdf-download { 
            background: rgba(0, 255, 136, 0.1); 
            border: 1px solid rgba(0, 255, 136, 0.3); 
            color: var(--success); 
            padding: 12px 18px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 0.8rem; 
            font-weight: 700; 
            transition: var(--transition); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            width: 100%;
            font-family: var(--font-hud);
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
        }

        .btn-pdf-download:hover { 
            background: rgba(0, 255, 136, 0.2); 
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.2);
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
            transform: translateY(-1px);
        }

        .visit-new-btn { 
            background: rgba(255, 174, 0, 0.08); 
            border: 1px dashed rgba(255, 174, 0, 0.35); 
            color: var(--neon-amber); 
            padding: 14px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 700; 
            text-align: center; 
            transition: var(--transition); 
            margin-top: 6px;
            font-family: var(--font-hud);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 174, 0, 0.3);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .visit-new-btn:hover { 
            background: rgba(255, 174, 0, 0.15); 
            border-color: var(--neon-amber);
            box-shadow: 0 0 20px rgba(255, 174, 0, 0.15);
            text-shadow: 0 0 15px rgba(255, 174, 0, 0.6);
            transform: translateY(-1px);
        }

        .btn-delete-visit { 
            background: rgba(255, 42, 109, 0.1); 
            color: var(--neon-pink); 
            border: 1px solid rgba(255, 42, 109, 0.25); 
            padding: 10px 14px; 
            font-size: 0.75rem; 
            border-radius: 2px; 
            cursor: pointer; 
            transition: var(--transition);
            font-family: var(--font-hud);
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.3);
        }

        .btn-delete-visit:hover { 
            background: rgba(255, 42, 109, 0.2);
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.2);
            text-shadow: 0 0 12px rgba(255, 42, 109, 0.6);
        }

        /* === PHOTO GALLERY === */
        .photo-gallery { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            align-items: center;
        }

        .photo-thumb-wrap { 
            position: relative; 
            width: 74px; 
            height: 74px; 
            border-radius: 2px; 
            overflow: hidden; 
            border: 1px solid rgba(0, 240, 255, 0.2); 
            background: rgba(0, 0, 0, 0.4); 
            flex-shrink: 0;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            transition: var(--transition);
        }

        .photo-thumb-wrap:hover {
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            transform: scale(1.05);
        }

        .photo-thumb { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            cursor: pointer; 
            transition: transform 0.3s;
        }

        .photo-thumb:active { transform: scale(1.1); }

        .photo-delete-btn { 
            position: absolute; 
            top: 4px; 
            right: 4px; 
            background: rgba(0, 0, 0, 0.8); 
            color: var(--neon-pink); 
            border: 1px solid rgba(255, 42, 109, 0.4); 
            border-radius: 50%; 
            width: 20px; 
            height: 20px; 
            font-size: 10px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 2;
            text-shadow: 0 0 5px rgba(255, 42, 109, 0.5);
            box-shadow: 0 0 8px rgba(255, 42, 109, 0.2);
            transition: var(--transition);
        }

        .photo-delete-btn:hover {
            background: rgba(255, 42, 109, 0.3);
            transform: scale(1.2);
        }

        .add-photo-btn { 
            width: 74px; 
            height: 74px; 
            border-radius: 2px; 
            background: rgba(0, 240, 255, 0.05); 
            border: 2px dashed rgba(0, 240, 255, 0.2); 
            color: var(--neon-cyan); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.8rem; 
            cursor: pointer; 
            transition: var(--transition); 
            flex-shrink: 0;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .add-photo-btn:hover { 
            border-color: var(--neon-cyan); 
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
            transform: scale(1.05);
        }

        /* === ACTION BUTTONS === */
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn { 
            padding: 12px 18px; 
            border-radius: 2px; 
            font-weight: 700; 
            font-size: 0.85rem; 
            cursor: pointer; 
            border: none; 
            transition: var(--transition); 
            flex: 1; 
            min-width: 80px; 
            text-align: center;
            font-family: var(--font-hud);
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-save { 
            background: linear-gradient(135deg, var(--neon-pink), #ff0055); 
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.3);
        }

        .btn-save:hover {
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.5);
            transform: translateY(-2px);
        }

        .btn-edit { 
            background: rgba(0, 240, 255, 0.1); 
            color: var(--text-primary); 
            border: 1px solid rgba(0, 240, 255, 0.25);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .btn-edit:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);

        // ============================================
        // VISIT MANAGEMENT
        // ============================================
        function addVisit(recordId) {
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec);
            visits.push({ visit_date: getTodayISO(), mileage: '', work_description: '[]', work_cost: 0, materials: '', material_cost: 0, notes: '', status: 'in_progress', date_completed: null });
            rec.visits = serializeVisits(visits);
            updateVisitsField(recordId, visits);
            const newIdx = visits.length - 1;
            expandedVisitIds[`${recordId}_${newIdx}`] = true;
            startEditVisit(recordId, newIdx);
        }

        function deleteVisit(recordId, visitIndex) {
            if (!isAdmin()) { alert('Только администратор может удалять визиты'); return; }
            if (!confirm('Удалить этот визит?')) return;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec); visits.splice(visitIndex, 1);
            rec.visits = serializeVisits(visits); updateVisitsField(recordId, visits);
            editingVisitId = null; renderExpandedContent(recordId);
        }

        function toggleVisitExpansion(recordId, visitIndex) {
            expandedVisitIds[`${recordId}_${visitIndex}`] = !expandedVisitIds[`${recordId}_${visitIndex}`];
            renderExpandedContent(recordId);
        }

        function toggleInvoiceDisplay(recordId, visitIndex) {
            const key = `${recordId}_${visitIndex}`;
            expandedInvoiceIds[key] = !expandedInvoiceIds[key];
            renderExpandedContent(recordId);
        }

        async function closeVisitAndCreateInvoice(recordId, visitIndex) {
            if (!isAdmin()) { alert('Только администратор может закрывать визиты'); return; }
            if (!confirm('Закрыть визит и создать счёт-фактуру?')) return;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec); const v = visits[visitIndex]; if (!v) return;
            const discountCheckbox = document.getElementById(`discount_${recordId}_${visitIndex}`);
            const applyDiscount = discountCheckbox ? discountCheckbox.checked : false;
            const workItems = parseWorkDescription(v.work_description);
            const workCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
            const materialCost = parseFloat(v.material_cost) || 0;
            const subtotal = workCost + materialCost;
            const discountAmount = applyDiscount ? Math.round(subtotal * 0.1 * 100) / 100 : 0;
            const total = subtotal - discountAmount;
            const invoice = {
                invoice_number: `INV-${recordId}-${visitIndex}-${Date.now().toString(36).toUpperCase()}`,
                invoice_date: getTodayISO(), car_brand: rec.car_brand || 'Без марки', plate_number: rec.plate_number || '',
                client_name: rec.client_name || '', client_phone: rec.client_phone || '',
                visit_date: v.visit_date, mileage: v.mileage || '',
                works: workItems, work_cost: workCost, materials: v.materials || '', material_cost: materialCost,
                subtotal: subtotal, discount_10: applyDiscount, discount_amount: discountAmount, total: total
            };
            const invoices = getInvoicesArr(rec); invoices.push(invoice);
            rec.invoice_data = serializeInvoices(invoices);
            visits[visitIndex].status = 'completed';
            visits[visitIndex].date_completed = getTodayISO();
            visits[visitIndex].work_cost = workCost;
            rec.visits = serializeVisits(visits);
            updateSyncStatus('saving');
            const { error } = await client.from('speedline_records').update({ visits: rec.visits, invoice_data: rec.invoice_data }).eq('id', recordId);
            if (error) { alert('Ошибка: ' + error.message); updateSyncStatus('error'); return; }
            updateSyncStatus('ok');
            expandedInvoiceIds[`${recordId}_${visitIndex}`] = true;
            renderExpandedContent(recordId);
        }

        async function closeCurrentVisitAndCreateInvoice(recordId) {
            if (!isAdmin()) { alert('Только администратор может закрывать визиты'); return; }
            if (!confirm('Завершить текущий визит и создать счёт-фактуру?')) return;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const discountCheckbox = document.getElementById(`discount_current_${recordId}`);
            const applyDiscount = discountCheckbox ? discountCheckbox.checked : false;
            const workItems = parseWorkDescription(rec.work_description);
            const workCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
            const materialCost = parseFloat(rec.material_cost) || 0;
            const subtotal = workCost + materialCost;
            const discountAmount = applyDiscount ? Math.round(subtotal * 0.1 * 100) / 100 : 0;
            const total = subtotal - discountAmount;
            const today = getTodayISO();
            const completedVisit = {
                visit_date: rec.date || today, mileage: '', work_description: rec.work_description || '[]',
                work_cost: workCost, materials: rec.materials || '', material_cost: materialCost,
                notes: rec.notes || '', status: 'completed', date_completed: today
            };
            const visits = getVisitsArr(rec); visits.push(completedVisit);
            const invoice = {
                invoice_number: `INV-${recordId}-${visits.length - 1}-${Date.now().toString(36).toUpperCase()}`,
                invoice_date: today, car_brand: rec.car_brand || 'Без марки', plate_number: rec.plate_number || '',
                client_name: rec.client_name || '', client_phone: rec.client_phone || '',
                visit_date: rec.date || today, mileage: '',
                works: workItems, work_cost: workCost, materials: rec.materials || '', material_cost: materialCost,
                subtotal: subtotal, discount_10: applyDiscount, discount_amount: discountAmount, total: total
            };
            const invoices = getInvoicesArr(rec); invoices.push(invoice);
            const updateData = {
                date: today, work_description: '[]', work_cost: 0, materials: '', material_cost: 0,
                notes: '', status: 'in_progress', date_completed: null,
                visits: serializeVisits(visits), invoice_data: serializeInvoices(invoices)
            };
            updateSyncStatus('saving');
            const { error } = await client.from('speedline_records').update(updateData).eq('id', recordId);
            if (error) { alert('Ошибка: ' + error.message); updateSyncStatus('error'); return; }
            Object.assign(rec, updateData);
            updateSyncStatus('ok');
            expandedInvoiceIds[`${recordId}_${visits.length - 1}`] = true;
            expandedVisitIds[`${recordId}_${visits.length - 1}`] = true;
            renderCardsList();
            if (expandedCardId === recordId) renderExpandedContent(recordId);
            alert('Визит завершён! Счёт-фактура создана в истории обслуживания.');
        }

        async function updateVisitsField(id, visitsArr) {
            updateSyncStatus('saving');
            clearTimeout(saveTimeouts['visits_'+id]);
            saveTimeouts['visits_'+id] = setTimeout(async () => {
                const { error } = await client.from('speedline_records').update({ visits: serializeVisits(visitsArr) }).eq('id', id);
                if (error) updateSyncStatus('error'); else updateSyncStatus('ok');
            }, 500);
        }

        function startEditVisit(recordId, visitIndex) {
            editingVisitId = `${recordId}_${visitIndex}`;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec); const v = visits[visitIndex]; if (!v) return;
            visitEditStates[editingVisitId] = { visit_date: v.visit_date || '', mileage: v.mileage || '', work_description: v.work_description || '[]', materials: v.materials || '', material_cost: v.material_cost || 0, notes: v.notes || '', status: v.status || 'in_progress' };
            renderExpandedContent(recordId);
        }

        function cancelEditVisit(recordId, visitIndex) {
            delete visitEditStates[`${recordId}_${visitIndex}`]; editingVisitId = null;
            renderExpandedContent(recordId);
        }

        async function saveVisit(recordId, visitIndex) {
            const key = `${recordId}_${visitIndex}`; const state = visitEditStates[key]; if (!state) return;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec);
            const workItems = parseWorkDescription(state.work_description);
            const totalWorkCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
            visits[visitIndex] = { ...visits[visitIndex], visit_date: state.visit_date, mileage: parseInt(state.mileage) || null, work_description: state.work_description, work_cost: totalWorkCost, materials: state.materials, material_cost: parseFloat(state.material_cost) || 0, notes: state.notes, status: state.status, date_completed: state.status === 'completed' ? (visits[visitIndex].date_completed || getTodayISO()) : visits[visitIndex].date_completed };
            rec.visits = serializeVisits(visits); await updateVisitsField(recordId, visits);
            delete visitEditStates[key]; editingVisitId = null; renderExpandedContent(recordId);
        }

        function handleVisitEditChange(recordId, visitIndex, field, value) {
            const key = `${recordId}_${visitIndex}`; if (!visitEditStates[key]) visitEditStates[key] = {};
            visitEditStates[key][field] = value;
        }

        function updateVisitWorkItem(recordId, visitIndex, itemIndex, field, value) {
            const key = `${recordId}_${visitIndex}`; if (!visitEditStates[key]) return;
            const workItems = parseWorkDescription(visitEditStates[key].work_description || '[]');
            if (workItems[itemIndex]) {
                if (field === 'cost') workItems[itemIndex].cost = parseFloat(value) || 0;
                else if (field === 'name') { const ci = WORKS_CATALOG.find(c => c.name === value); workItems[itemIndex].name = value; if (ci) workItems[itemIndex].cost = ci.cost; }
                visitEditStates[key].work_description = serializeWorkDescription(workItems); renderExpandedContent(recordId);
            }
        }

        function addVisitWorkItem(recordId, visitIndex) {
            const key = `${recordId}_${visitIndex}`; if (!visitEditStates[key]) return;
            const workItems = parseWorkDescription(visitEditStates[key].work_description || '[]');
            workItems.push({ name: WORKS_CATALOG[0].name, cost: WORKS_CATALOG[0].cost });
            visitEditStates[key].work_description = serializeWorkDescription(workItems); renderExpandedContent(recordId);
        }

        function removeVisitWorkItem(recordId, visitIndex, itemIndex) {
            const key = `${recordId}_${visitIndex}`; if (!visitEditStates[key]) return;
            const workItems = parseWorkDescription(visitEditStates[key].work_description || '[]');
            workItems.splice(itemIndex, 1);
            visitEditStates[key].work_description = serializeWorkDescription(workItems); renderExpandedContent(recordId);
        }

        function triggerPhotoUpload(id) { const input = document.getElementById(`fileInput_${id}`); if (input) input.click(); }

        async function uploadPhotos(id, inputElement) {
            const files = inputElement.files; if (!files || files.length === 0) return;
            updateSyncStatus('saving'); const rec = workRecords.find(r => r.id === id); if (!rec) return;
            let photos = Array.isArray(rec.photos) ? [...rec.photos] : [];
            for (let file of files) {
                const ext = file.name.split('.').pop() || 'jpg';
                const fn = `repair_${id}_${Date.now()}_${Math.random().toString(36).substring(2,7)}.${ext}`;
                const { error: uploadError } = await client.storage.from('Logo').upload(fn, file, { upsert: true });
                if (uploadError) { alert('Ошибка загрузки: ' + uploadError.message); continue; }
                const { data: urlData } = client.storage.from('Logo').getPublicUrl(fn);
                if (urlData && urlData.publicUrl) photos.push(urlData.publicUrl);
            }
            const { error: updateError } = await client.from('speedline_records').update({ photos }).eq('id', id);
            if (updateError) { alert('Ошибка сохранения: ' + updateError.message); updateSyncStatus('error'); }
            else { rec.photos = photos; updateSyncStatus('ok'); if (expandedCardId === id) renderExpandedContent(id); }
            inputElement.value = '';
        }

        async function deletePhoto(id, photoIndex) {
            if (!confirm('Удалить эту фотографию?')) return;
            const rec = workRecords.find(r => r.id === id); if (!rec || !Array.isArray(rec.photos)) return;
            const photos = [...rec.photos]; photos.splice(photoIndex, 1);
            const { error } = await client.from('speedline_records').update({ photos }).eq('id', id);
            if (error) { alert('Ошибка удаления: ' + error.message); return; }
            rec.photos = photos; if (expandedCardId === id) renderExpandedContent(id);
        }

        // ============================================
        // RENDER
        // ============================================
        function renderCardsList() {
            const cardsList = getEl('cardsList'); if (!cardsList) return;
            let filtered = workRecords;
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                filtered = workRecords.filter(r => (r.car_brand||'').toLowerCase().includes(q) || (r.vin||'').toLowerCase().includes(q) || (r.plate_number||'').toLowerCase().includes(q) || (r.client_name||'').toLowerCase().includes(q) || (r.client_phone||'').includes(q) || (r.date||'').includes(q) || formatDate(r.date).includes(q));
            }
            if (filtered.length === 0) {
                cardsList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔧</div><p>${searchQuery?'Ничего не найдено':'Нет записей. Добавьте первое авто!'}</p></div>`;
                return;
            }
            cardsList.innerHTML = filtered.map(rec => {
                const isExpanded = expandedCardId === rec.id;
                const statusInfo = STATUS_OPTIONS.find(s => s.value === rec.status) || STATUS_OPTIONS[0];
                const visits = getVisitsArr(rec);
                return `<div class="card-wrapper" id="cardWrapper_${rec.id}"><div class="compact-card ${isExpanded?'expanded':''}" onclick="toggleCardExpansion(${rec.id})"><span class="car-icon">🚗</span><div class="compact-info"><div class="compact-primary"><span class="compact-car">${escapeHTML(rec.car_brand||'Без марки')}</span>${rec.plate_number?`<span class="compact-plate">${escapeHTML(rec.plate_number)}</span>`:''}</div><div class="compact-secondary">${rec.client_name?`<span class="compact-client">👤 ${escapeHTML(rec.client_name)}</span>`:''}${rec.client_phone?`<span style="color:var(--text-secondary);font-size:0.7rem;">📱 ${escapeHTML(rec.client_phone)}</span>`:''}<span class="compact-date">📅 ${formatDate(rec.date)}</span>${visits.length>0?`<span class="compact-visits">🔄 ${visits.length}</span>`:''}</div></div><span class="status-badge status-${rec.status}">${statusInfo.label}</span><span class="expand-arrow">▼</span></div><div class="expanded-content" id="expandedContent_${rec.id}">${isExpanded?renderExpandedContentHTML(rec):''}</div></div>`;
            }).join('');
        }

                                <div class="field"><div class="field-label">📝 Заметки</div><textarea rows="2" oninput="handleVisitEditChange(${rec.id},${idx},'notes',this.value)">${escapeHTML(vDisplay.notes||'')}</textarea></div>
                                <div style="display:flex;gap:8px;margin-top:8px;">
                                    <button class="btn btn-save" onclick="event.stopPropagation();saveVisit(${rec.id},${idx})">💾 Сохранить</button>
                                    <button class="btn btn-edit" onclick="event.stopPropagation();cancelEditVisit(${rec.id},${idx})">↩ Отменить</button>
                                    ${isAdmin()?`<button class="btn-delete-visit" onclick="event.stopPropagation();deleteVisit(${rec.id},${idx})">🗑️ Удалить</button>`:''}
                                </div>` : `
                                <div class="field-row"><div class="field"><div class="field-label">📅 Дата</div><input value="${formatDate(v.visit_date)}" disabled></div><div class="field"><div class="field-label">🔢 Пробег</div><input value="${v.mileage?v.mileage+' км':'—'}" disabled></div></div>
                                <div class="field"><div class="field-label">📌 Статус</div><input value="${vStatusInfo.label}" disabled></div>
                                ${!isCompleted && isAdmin() ? `
                                    <div class="discount-checkbox-wrap">
                                        <input type="checkbox" id="discount_${rec.id}_${idx}" onchange="event.stopPropagation();">
                                        <label for="discount_${rec.id}_${idx}">Применить скидку 10%</label>
                                    </div>
                                    <button class="btn-close-visit" onclick="event.stopPropagation();closeVisitAndCreateInvoice(${rec.id},${idx})">
                                        🔒 Закрыть визит и создать счёт-фактуру
                                    </button>` : ''}
                                ${visitInvoice ? `
                                    <button class="btn-invoice-toggle" onclick="event.stopPropagation();toggleInvoiceDisplay(${rec.id},${idx})">
                                        ${invoiceOpen ? '📊 Скрыть счёт' : '🧾 Показать счёт'}
                                    </button>
                                    ${invoiceOpen ? `
                                        <div class="invoice-box">
                                            <div class="invoice-title">📋 СЧЁТ-ФАКТУРА №${visitInvoice.invoice_number}</div>
                                            <div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:6px;">🚗 ${escapeHTML(visitInvoice.car_brand)} ${escapeHTML(visitInvoice.plate_number)} | 📅 ${formatDate(visitInvoice.invoice_date)}</div>
                                            ${visitInvoice.client_name ? `<div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:6px;">👤 ${escapeHTML(visitInvoice.client_name)}${visitInvoice.client_phone ? ' | 📱 '+escapeHTML(visitInvoice.client_phone) : ''}</div>` : ''}
                                            <table class="invoice-table">
                                                <thead><tr><th>Категория</th><th>Наименование</th><th>Сумма</th></tr></thead>
                                                <tbody>${Object.entries(groupWorksByCategory(visitInvoice.works)).map(([cat, items]) => `<tr class="invoice-category-row"><td colspan="3">${escapeHTML(cat)}</td></tr>${items.map(w => `<tr><td></td><td>${escapeHTML(w.name)}</td><td>${(parseFloat(w.cost)||0).toFixed(0)} €</td></tr>`).join('')}</tbody>`).join('')}</tbody>
                                            </table>
                                            <div class="invoice-total-line"><span>💵 Работы:</span><span>${visitInvoice.work_cost.toFixed(0)} €</span></div>
                                            ${visitInvoice.materials ? `<div class="invoice-total-line"><span>🔩 Расходники:</span><span>${visitInvoice.material_cost.toFixed(0)} €</span></div>` : ''}
                                            <div class="invoice-total-line"><span>Подытог:</span><span>${visitInvoice.subtotal.toFixed(0)} €</span></div>
                                            ${visitInvoice.discount_10 ? `<div class="invoice-discount-line"><span>🔖 Скидка 10%:</span><span>-${visitInvoice.discount_amount.toFixed(0)} €</span></div>` : ''}
                                            <div class="invoice-final-line"><span>💰 ИТОГО:</span><span>${visitInvoice.total.toFixed(0)} €</span></div>
                                            <div style="text-align:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);">
                                                <button class="btn-pdf-download" onclick="event.stopPropagation();downloadInvoicePDF(${rec.id},${idx})">📥 Скачать PDF</button>
                                            </div>
                                        </div>` : ''}
                                ` : ''}
                                <div style="display:flex;gap:8px;margin-top:8px;">
                                    ${!isCompleted ? `<button class="btn btn-edit" onclick="event.stopPropagation();startEditVisit(${rec.id},${idx})">✏️</button>` : ''}
                                    ${isAdmin()?`<button class="btn-delete-visit" onclick="event.stopPropagation();deleteVisit(${rec.id},${idx})">🗑️</button>`:''}
                                </div>`}
                        </div>
                    </div>`;
                });
            } else {
                visitsHTML += `<div style="color:var(--text-secondary);font-size:0.85rem;text-align:center;padding:12px;">Нет завершённых визитов</div>`;
            }
            visitsHTML += `<button class="visit-new-btn" onclick="event.stopPropagation();addVisit(${rec.id})">🔄 Новый визит</button></div>`;

            return `
                ${infoHTML}
                ${currentVisitHTML}
                ${visitsHTML}
                <div class="section-title">📸 Фотографии</div>
                <div class="photo-gallery">
                    ${photosList.map((url,pIdx) => `<div class="photo-thumb-wrap"><img src="${url}" class="photo-thumb" onclick="window.open('${url}','_blank')"><button class="photo-delete-btn" onclick="event.stopPropagation();deletePhoto(${rec.id},${pIdx})">✕</button></div>`).join('')}
                    <div class="add-photo-btn" onclick="triggerPhotoUpload(${rec.id})">＋</div>
                    <input type="file" id="fileInput_${rec.id}" class="hidden-file-input" accept="image/*" multiple onchange="uploadPhotos(${rec.id}, this)">
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,42,109,0.1);padding:14px;border-radius:2px;font-weight:800;font-size:1.1rem;border:1px solid rgba(255,42,109,0.2);clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);box-shadow:0 0 20px rgba(255,42,109,0.1);font-family:var(--font-hud);text-shadow:0 0 10px rgba(255,42,109,0.3);"><span>💰 Итого по машине (все визиты):</span><span style="color:var(--neon-pink);text-shadow:0 0 15px rgba(255,42,109,0.5);">${allTimeTotal.toFixed(0)} €</span></div>
                <div class="action-buttons">
                    ${isAdmin()?`<button class="btn btn-delete" onclick="event.stopPropagation();deleteRecord(${rec.id})">🗑️ Удалить авто</button>`:''}
                </div>`;
        }

        function renderExpandedContent(id) {
            const content = getEl(`expandedContent_${id}`); if (!content) return;
            const rec = workRecords.find(r => r.id === id); if (!rec) return;
            content.innerHTML = renderExpandedContentHTML(rec);
        }

        function toggleCardExpansion(id) {
            if (expandedCardId === id) { expandedCardId = null; }
            else { expandedCardId = id; }
            renderCardsList();
        }

        let searchTimeout;
        getEl('searchInput').addEventListener('input', function() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { searchQuery = this.value; expandedCardId = null; editingInfoId = null; editingVisitId = null; infoEditStates = {}; visitEditStates = {}; expandedVisitIds = {}; expandedInvoiceIds = {}; renderCardsList(); }, 200); });
        getEl('addBtn').addEventListener('click', addRecord);

        function initRealtime() { client.channel('public:speedline_records').on('postgres_changes', { event: '*', schema: 'public', table: 'speedline_records' }, () => fetchRecords()).subscribe(); }

        (async function initApp() {
            const isAuth = await checkSession();
            if (!isAuth) return;
            await fetchRecords();
            initRealtime();
        })();
    </script>
</body>
</html>
