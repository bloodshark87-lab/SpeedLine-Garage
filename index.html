<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedLine Data — Учет автосервиса</title>
    <!-- Tailwind CSS для адаптивного интерфейса -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-blue-600">SpeedLine Data</h1>
            <p class="text-sm text-gray-600">Система учета ремонтных работ и обслуживания автомобилей</p>
        </header>

        <!-- Форма добавления записи -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Новая запись о ремонте</h2>
            <form id="serviceForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Дата</label>
                    <input type="date" id="date" required class="w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Марка и модель авто</label>
                    <input type="text" id="car_model" placeholder="Например: Citroen Xsara Picasso" required class="w-full p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Госномер</label>
                    <input type="text" id="plate" placeholder="А123БВ77" class="w-full p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">VIN-код</label>
                    <input type="text" id="vin" placeholder="17 символов" class="w-full p-2 border rounded-md">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Выполненные работы</label>
                    <textarea id="works" rows="2" placeholder="Описание работ..." class="w-full p-2 border rounded-md"></textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Расходники / Запчасти</label>
                    <textarea id="materials" rows="2" placeholder="Список запчастей..." class="w-full p-2 border rounded-md"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Стоимость</label>
                    <input type="text" id="cost" placeholder="0.00" class="w-full p-2 border rounded-md">
                </div>
                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition">Сохранить в базу</button>
                </div>
            </form>
        </div>

        <!-- Список записей -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">История записей</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-sm">
                            <th class="p-2 border">Дата</th>
                            <th class="p-2 border">Автомобиль</th>
                            <th class="p-2 border">Госномер</th>
                            <th class="p-2 border">Работы</th>
                            <th class="p-2 border">Запчасти</th>
                            <th class="p-2 border">Стоимость</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody" class="text-sm">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-gray-500">Загрузка данных...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qtkbqqnfuwzqytssxmah.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ie9PR5RfGNzTlHz2PAHAPQ_bg_oMHXd';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Установка текущей даты по умолчанию
        document.getElementById('date').valueAsDate = new Date();

        async function loadRecords() {
            const tbody = document.getElementById('recordsTableBody');
            const { data, error } = await supabaseClient
                .from('SpeedLine Data')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки:', error.message);
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Ошибка загрузки: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Нет записей</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(row => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 border">${row.date || ''}</td>
                    <td class="p-2 border font-medium">${row.car_model || ''}</td>
                    <td class="p-2 border">${row.plate || ''}</td>
                    <td class="p-2 border">${row.works || ''}</td>
                    <td class="p-2 border">${row.materials || ''}</td>
                    <td class="p-2 border font-semibold text-green-600">${row.cost || ''}</td>
                </tr>
            `).join('');
        }

        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newRecord = {
                date: document.getElementById('date').value,
                car_model: document.getElementById('car_model').value,
                plate: document.getElementById('plate').value,
                vin: document.getElementById('vin').value,
                works: document.getElementById('works').value,
                materials: document.getElementById('materials').value,
                cost: document.getElementById('cost').value
            };

            const { error } = await supabaseClient
                .from('SpeedLine Data')
                .insert([newRecord]);

            if (error) {
                alert('Ошибка сохранения: ' + error.message);
            } else {
                document.getElementById('serviceForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                loadRecords();
            }
        });

        // Загружаем данные при старте
        loadRecords();
    </script>
</body>
</html>
