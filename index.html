        // ============================================
        // UTILS
        // ============================================
        const getEl = (id) => document.getElementById(id);

        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }

        function getTodayISO() { return new Date().toISOString().split('T')[0]; }

        function parseWorkDescription(desc) {
            if (!desc) return [];
            try { const p = JSON.parse(desc); return Array.isArray(p) ? p : []; }
            catch { return []; }
        }
        function serializeWorkDescription(items) { return JSON.stringify(items); }

        function parseVisits(json) {
            if (!json) return [];
            try { const p = JSON.parse(json); return Array.isArray(p) ? p : []; }
            catch { return []; }
        }
        function serializeVisits(arr) { return JSON.stringify(arr); }

        function parseInvoices(json) {
            if (!json) return [];
            try { const p = JSON.parse(json); return Array.isArray(p) ? p : []; }
            catch { return []; }
        }
        function serializeInvoices(arr) { return JSON.stringify(arr); }

        function getGroupedCatalog() {
            return WORKS_CATALOG.reduce((acc, cat) => {
                if (!acc[cat.category]) acc[cat.category] = [];
                acc[cat.category].push(cat);
                return acc;
            }, {});
        }

        function getVisitsArr(rec) { return rec ? parseVisits(rec.visits) : []; }
        function getInvoicesArr(rec) { return rec ? parseInvoices(rec.invoice_data) : []; }

        function groupWorksByCategory(workItems) {
            const grouped = {};
            workItems.forEach(w => {
                const catalogItem = WORKS_CATALOG.find(c => c.name === w.name);
                const cat = catalogItem ? catalogItem.category : 'Прочее';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(w);
            });
            return grouped;
        }

        // ============================================
        // DATA FETCHING
        // ============================================
        async function fetchRecords() {
            const { data, error } = await client.from('speedline_records').select('*').order('id', { ascending: false });
            if (error) { console.error('Ошибка загрузки:', error); updateSyncStatus('error'); return; }
            workRecords = data || [];
            updateSyncStatus('ok');
            renderCardsList();
        }

        function updateSyncStatus(status) {
            const el = getEl('syncStatus'); if (!el) return;
            if (status === 'error') { el.textContent = '🔴 Офлайн'; el.className = 'sync-badge error'; }
            else if (status === 'saving') { el.textContent = '🟡 Сохранение...'; el.className = 'sync-badge'; }
            else { el.textContent = '🟢 Онлайн'; el.className = 'sync-badge'; }
        }

        async function addRecord() {
            const today = getTodayISO();
            const nr = { date: today, car_brand: '', vin: '', plate_number: '', client_name: '', client_phone: '', work_description: '[]', work_cost: 0, materials: '', material_cost: 0, notes: '', photos: [], status: 'in_progress', date_completed: null, archived: false, visits: '[]', invoice_data: '[]' };
            const { data, error } = await client.from('speedline_records').insert([nr]).select();
            if (error) { alert('Ошибка добавления: ' + error.message); return; }
            if (data && data.length > 0) { workRecords.unshift(data[0]); renderCardsList(); setTimeout(() => toggleCardExpansion(data[0].id), 100); }
        }

        async function deleteRecord(id) {
            if (!isAdmin()) { alert('Только администратор может удалять записи'); return; }
            if (!confirm('Удалить эту запись из общей базы?')) return;
            const { error } = await client.from('speedline_records').delete().eq('id', id);
            if (error) { alert('Ошибка удаления: ' + error.message); return; }
            workRecords = workRecords.filter(r => r.id !== id);
            expandedCardId = null; editingInfoId = null; renderCardsList();
        }

        // ============================================
        // INFO EDITING
        // ============================================
        function startEditInfo(id) {
            editingInfoId = id;
            const rec = workRecords.find(r => r.id === id);
            if (rec) {
                infoEditStates[id] = {
                    client_name: rec.client_name || '',
                    client_phone: rec.client_phone || '',
                    car_brand: rec.car_brand || '',
                    vin: rec.vin || '',
                    plate_number: rec.plate_number || '',
                    date: rec.date || ''
                };
            }
            renderExpandedContent(id);
        }

        function cancelEditInfo(id) {
            delete infoEditStates[id];
            editingInfoId = null;
            renderExpandedContent(id);
        }

        async function saveInfo(id) {
            const state = infoEditStates[id]; if (!state) return;
            updateSyncStatus('saving');
            const upd = { client_name: state.client_name, client_phone: state.client_phone, car_brand: state.car_brand, vin: state.vin, plate_number: state.plate_number, date: state.date };
            const { error } = await client.from('speedline_records').update(upd).eq('id', id);
            if (error) { alert('Ошибка: ' + error.message); updateSyncStatus('error'); return; }
            const rec = workRecords.find(r => r.id === id);
            if (rec) Object.assign(rec, upd);
            delete infoEditStates[id];
            editingInfoId = null;
            updateSyncStatus('ok');
            renderExpandedContent(id);
            renderCardsList();
        }

        function handleInfoChange(id, field, value) {
            if (!infoEditStates[id]) infoEditStates[id] = {};
            infoEditStates[id][field] = value;
        }

        async function downloadInvoicePDF(recordId, visitIndex) {
            const rec = workRecords.find(r => r.id === recordId);
            if (!rec) return;
            const invoices = getInvoicesArr(rec);
            const visits = getVisitsArr(rec);
            const v = visits[visitIndex];
            if (!v) return;
            const vWorkItems = parseWorkDescription(v.work_description);
            const vWorkCost = vWorkItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
            const invoice = invoices.find(inv => inv.visit_date === v.visit_date && inv.work_cost === vWorkCost);
            if (!invoice) { alert('Счёт-фактура не найдена'); return; }
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                let y = 20;
                doc.setFontSize(20); doc.setTextColor(220, 38, 38); doc.text('SpeedLine Garage', 14, y); y += 8;
                doc.setFontSize(9); doc.setTextColor(120, 120, 120); doc.text('DOCKA MACTEPA', 14, y); y += 10;
                doc.setFontSize(12); doc.setTextColor(59, 130, 246); doc.text(`Schet-Faktura: ${invoice.invoice_number}`, 14, y); y += 6;
                doc.setFontSize(9); doc.setTextColor(80, 80, 80); doc.text(`Data: ${formatDate(invoice.invoice_date)}`, 14, y); y += 10;
                doc.setFontSize(11); doc.setTextColor(0, 0, 0); doc.text(`Auto: ${invoice.car_brand} | ${invoice.plate_number}`, 14, y); y += 6;
                if (invoice.client_name) { doc.text(`Klient: ${invoice.client_name}`, 14, y); y += 6; }
                if (invoice.mileage) { doc.text(`Probeg: ${invoice.mileage} km`, 14, y); y += 6; }
                y += 6;
                doc.setFillColor(30, 41, 59); doc.setTextColor(255, 255, 255); doc.setFontSize(8);
                doc.rect(14, y, 182, 7, 'F'); doc.text('KATEGORIYA', 16, y + 5); doc.text('NAIMENOVANIE', 75, y + 5); doc.text('SUMMA', 188, y + 5, { align: 'right' }); y += 9;
                const grouped = groupWorksByCategory(invoice.works);
                Object.entries(grouped).forEach(([cat, items]) => {
                    doc.setFillColor(245, 158, 11, 0.15); doc.setTextColor(200, 130, 0); doc.setFontSize(7);
                    doc.rect(14, y, 182, 6, 'F'); doc.text(cat, 16, y + 4); y += 7;
                    doc.setTextColor(50, 50, 50); doc.setFontSize(8);
                    items.forEach(w => { if (y > 270) { doc.addPage(); y = 20; } doc.text(w.name, 75, y + 4); doc.text(`${parseFloat(w.cost).toFixed(0)} E`, 188, y + 4, { align: 'right' }); y += 5.5; });
                });
                y += 5; doc.setDrawColor(200); doc.line(100, y, 196, y); y += 7;
                doc.setFontSize(9); doc.setTextColor(50, 50, 50);
                doc.text('Raboti:', 100, y); doc.text(`${invoice.work_cost.toFixed(0)} E`, 188, y, { align: 'right' }); y += 5.5;
                if (invoice.material_cost > 0) { doc.text('Rashodniki:', 100, y); doc.text(`${invoice.material_cost.toFixed(0)} E`, 188, y, { align: 'right' }); y += 5.5; }
                doc.text('Podytog:', 100, y); doc.text(`${invoice.subtotal.toFixed(0)} E`, 188, y, { align: 'right' }); y += 5.5;
                if (invoice.discount_10) { doc.setTextColor(200, 130, 0); doc.text('Skidka 10%:', 100, y); doc.text(`-${invoice.discount_amount.toFixed(0)} E`, 188, y, { align: 'right' }); y += 5.5; }
                y += 3; doc.setDrawColor(220, 38, 38); doc.setLineWidth(0.5); doc.line(100, y, 196, y); y += 7;
                doc.setFontSize(12); doc.setTextColor(220, 38, 38); doc.setFont(undefined, 'bold');
                doc.text('ITOGO K OPLATE:', 100, y); doc.text(`${invoice.total.toFixed(0)} E`, 188, y, { align: 'right' });
                doc.setFontSize(8); doc.setTextColor(150); doc.setFont(undefined, 'normal');
                doc.text('Spasibo, chto vibrali SpeedLine Garage!', 105, 280, { align: 'center' });
                doc.save(`schet_${invoice.invoice_number}.pdf`);
            } catch (err) { console.error('PDF Error:', err); alert('Ошибка при создании PDF'); }
        }

        function addVisit(recordId) {
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec);
            visits.push({ visit_date: getTodayISO(), mileage: '', work_description: '[]', work_cost: 0, materials: '', material_cost: 0, notes: '', status: 'in_progress', date_completed: null });
            rec.visits = serializeVisits(visits);
            updateVisitsField(recordId, visits);
            const newIdx = visits.length - 1;
            expandedVisitIds[`${recordId}_${newIdx}`] = true;
            startEditVisit(recordId, newIdx);
        }

        function deleteVisit(recordId, visitIndex) {
            if (!isAdmin()) { alert('Только администратор может удалять визиты'); return; }
            if (!confirm('Удалить этот визит?')) return;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec); visits.splice(visitIndex, 1);
            rec.visits = serializeVisits(visits); updateVisitsField(recordId, visits);
            editingVisitId = null; renderExpandedContent(recordId);
        }

        function toggleVisitExpansion(recordId, visitIndex) {
            expandedVisitIds[`${recordId}_${visitIndex}`] = !expandedVisitIds[`${recordId}_${visitIndex}`];
            renderExpandedContent(recordId);
        }

        function toggleInvoiceDisplay(recordId, visitIndex) {
            const key = `${recordId}_${visitIndex}`;
            expandedInvoiceIds[key] = !expandedInvoiceIds[key];
            renderExpandedContent(recordId);
        }

        async function closeVisitAndCreateInvoice(recordId, visitIndex) {
            if (!isAdmin()) { alert('Только администратор может закрывать визиты'); return; }
            if (!confirm('Закрыть визит и создать счёт-фактуру?')) return;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec); const v = visits[visitIndex]; if (!v) return;
            const discountCheckbox = document.getElementById(`discount_${recordId}_${visitIndex}`);
            const applyDiscount = discountCheckbox ? discountCheckbox.checked : false;
            const workItems = parseWorkDescription(v.work_description);
            const workCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
            const materialCost = parseFloat(v.material_cost) || 0;
            const subtotal = workCost + materialCost;
            const discountAmount = applyDiscount ? Math.round(subtotal * 0.1 * 100) / 100 : 0;
            const total = subtotal - discountAmount;
            const invoice = {
                invoice_number: `INV-${recordId}-${visitIndex}-${Date.now().toString(36).toUpperCase()}`,
                invoice_date: getTodayISO(), car_brand: rec.car_brand || 'Без марки', plate_number: rec.plate_number || '',
                client_name: rec.client_name || '', client_phone: rec.client_phone || '',
                visit_date: v.visit_date, mileage: v.mileage || '',
                works: workItems, work_cost: workCost, materials: v.materials || '', material_cost: materialCost,
                subtotal: subtotal, discount_10: applyDiscount, discount_amount: discountAmount, total: total
            };
            const invoices = getInvoicesArr(rec); invoices.push(invoice);
            rec.invoice_data = serializeInvoices(invoices);
            visits[visitIndex].status = 'completed';
            visits[visitIndex].date_completed = getTodayISO();
            visits[visitIndex].work_cost = workCost;
            rec.visits = serializeVisits(visits);
            updateSyncStatus('saving');
            const { error } = await client.from('speedline_records').update({ visits: rec.visits, invoice_data: rec.invoice_data }).eq('id', recordId);
            if (error) { alert('Ошибка: ' + error.message); updateSyncStatus('error'); return; }
            updateSyncStatus('ok');
            expandedInvoiceIds[`${recordId}_${visitIndex}`] = true;
            renderExpandedContent(recordId);
        }

        async function closeCurrentVisitAndCreateInvoice(recordId) {
            if (!isAdmin()) { alert('Только администратор может закрывать визиты'); return; }
            if (!confirm('Завершить текущий визит и создать счёт-фактуру?')) return;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const discountCheckbox = document.getElementById(`discount_current_${recordId}`);
            const applyDiscount = discountCheckbox ? discountCheckbox.checked : false;
            const workItems = parseWorkDescription(rec.work_description);
            const workCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
            const materialCost = parseFloat(rec.material_cost) || 0;
            const subtotal = workCost + materialCost;
            const discountAmount = applyDiscount ? Math.round(subtotal * 0.1 * 100) / 100 : 0;
            const total = subtotal - discountAmount;
            const today = getTodayISO();
            const completedVisit = {
                visit_date: rec.date || today, mileage: '', work_description: rec.work_description || '[]',
                work_cost: workCost, materials: rec.materials || '', material_cost: materialCost,
                notes: rec.notes || '', status: 'completed', date_completed: today
            };
            const visits = getVisitsArr(rec); visits.push(completedVisit);
            const invoice = {
                invoice_number: `INV-${recordId}-${visits.length - 1}-${Date.now().toString(36).toUpperCase()}`,
                invoice_date: today, car_brand: rec.car_brand || 'Без марки', plate_number: rec.plate_number || '',
                client_name: rec.client_name || '', client_phone: rec.client_phone || '',
                visit_date: rec.date || today, mileage: '',
                works: workItems, work_cost: workCost, materials: rec.materials || '', material_cost: materialCost,
                subtotal: subtotal, discount_10: applyDiscount, discount_amount: discountAmount, total: total
            };
            const invoices = getInvoicesArr(rec); invoices.push(invoice);
            const updateData = {
                date: today, work_description: '[]', work_cost: 0, materials: '', material_cost: 0,
                notes: '', status: 'in_progress', date_completed: null,
                visits: serializeVisits(visits), invoice_data: serializeInvoices(invoices)
            };
            updateSyncStatus('saving');
            const { error } = await client.from('speedline_records').update(updateData).eq('id', recordId);
            if (error) { alert('Ошибка: ' + error.message); updateSyncStatus('error'); return; }
            Object.assign(rec, updateData);
            updateSyncStatus('ok');
            expandedInvoiceIds[`${recordId}_${visits.length - 1}`] = true;
            expandedVisitIds[`${recordId}_${visits.length - 1}`] = true;
            renderCardsList();
            if (expandedCardId === recordId) renderExpandedContent(recordId);
            alert('Визит завершён! Счёт-фактура создана в истории обслуживания.');
        }

        async function updateVisitsField(id, visitsArr) {
            updateSyncStatus('saving');
            clearTimeout(saveTimeouts['visits_'+id]);
            saveTimeouts['visits_'+id] = setTimeout(async () => {
                const { error } = await client.from('speedline_records').update({ visits: serializeVisits(visitsArr) }).eq('id', id);
                if (error) updateSyncStatus('error'); else updateSyncStatus('ok');
            }, 500);
        }

        function startEditVisit(recordId, visitIndex) {
            editingVisitId = `${recordId}_${visitIndex}`;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec); const v = visits[visitIndex]; if (!v) return;
            visitEditStates[editingVisitId] = { visit_date: v.visit_date || '', mileage: v.mileage || '', work_description: v.work_description || '[]', materials: v.materials || '', material_cost: v.material_cost || 0, notes: v.notes || '', status: v.status || 'in_progress' };
            renderExpandedContent(recordId);
        }

        function cancelEditVisit(recordId, visitIndex) {
            delete visitEditStates[`${recordId}_${visitIndex}`]; editingVisitId = null;
            renderExpandedContent(recordId);
        }

        async function saveVisit(recordId, visitIndex) {
            const key = `${recordId}_${visitIndex}`; const state = visitEditStates[key]; if (!state) return;
            const rec = workRecords.find(r => r.id === recordId); if (!rec) return;
            const visits = getVisitsArr(rec);
            const workItems = parseWorkDescription(state.work_description);
            const totalWorkCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
            visits[visitIndex] = { ...visits[visitIndex], visit_date: state.visit_date, mileage: parseInt(state.mileage) || null, work_description: state.work_description, work_cost: totalWorkCost, materials: state.materials, material_cost: parseFloat(state.material_cost) || 0, notes: state.notes, status: state.status, date_completed: state.status === 'completed' ? (visits[visitIndex].date_completed || getTodayISO()) : visits[visitIndex].date_completed };
            rec.visits = serializeVisits(visits); await updateVisitsField(recordId, visits);
            delete visitEditStates[key]; editingVisitId = null; renderExpandedContent(recordId);
        }

        function handleVisitEditChange(recordId, visitIndex, field, value) {
            const key = `${recordId}_${visitIndex}`; if (!visitEditStates[key]) visitEditStates[key] = {};
            visitEditStates[key][field] = value;
        }

        function updateVisitWorkItem(recordId, visitIndex, itemIndex, field, value) {
            const key = `${recordId}_${visitIndex}`; if (!visitEditStates[key]) return;
            const workItems = parseWorkDescription(visitEditStates[key].work_description || '[]');
            if (workItems[itemIndex]) {
                if (field === 'cost') workItems[itemIndex].cost = parseFloat(value) || 0;
                else if (field === 'name') { const ci = WORKS_CATALOG.find(c => c.name === value); workItems[itemIndex].name = value; if (ci) workItems[itemIndex].cost = ci.cost; }
                visitEditStates[key].work_description = serializeWorkDescription(workItems); renderExpandedContent(recordId);
            }
        }

        function addVisitWorkItem(recordId, visitIndex) {
            const key = `${recordId}_${visitIndex}`; if (!visitEditStates[key]) return;
            const workItems = parseWorkDescription(visitEditStates[key].work_description || '[]');
            workItems.push({ name: WORKS_CATALOG[0].name, cost: WORKS_CATALOG[0].cost });
            visitEditStates[key].work_description = serializeWorkDescription(workItems); renderExpandedContent(recordId);
        }

        function removeVisitWorkItem(recordId, visitIndex, itemIndex) {
            const key = `${recordId}_${visitIndex}`; if (!visitEditStates[key]) return;
            const workItems = parseWorkDescription(visitEditStates[key].work_description || '[]');
            workItems.splice(itemIndex, 1);
            visitEditStates[key].work_description = serializeWorkDescription(workItems); renderExpandedContent(recordId);
        }

        function triggerPhotoUpload(id) { const input = document.getElementById(`fileInput_${id}`); if (input) input.click(); }

        async function uploadPhotos(id, inputElement) {
            const files = inputElement.files; if (!files || files.length === 0) return;
            updateSyncStatus('saving'); const rec = workRecords.find(r => r.id === id); if (!rec) return;
            let photos = Array.isArray(rec.photos) ? [...rec.photos] : [];
            for (let file of files) {
                const ext = file.name.split('.').pop() || 'jpg';
                const fn = `repair_${id}_${Date.now()}_${Math.random().toString(36).substring(2,7)}.${ext}`;
                const { error: uploadError } = await client.storage.from('Logo').upload(fn, file, { upsert: true });
                if (uploadError) { alert('Ошибка загрузки: ' + uploadError.message); continue; }
                const { data: urlData } = client.storage.from('Logo').getPublicUrl(fn);
                if (urlData && urlData.publicUrl) photos.push(urlData.publicUrl);
            }
            const { error: updateError } = await client.from('speedline_records').update({ photos }).eq('id', id);
            if (updateError) { alert('Ошибка сохранения: ' + updateError.message); updateSyncStatus('error'); }
            else { rec.photos = photos; updateSyncStatus('ok'); if (expandedCardId === id) renderExpandedContent(id); }
            inputElement.value = '';
        }

        async function deletePhoto(id, photoIndex) {
            if (!confirm('Удалить эту фотографию?')) return;
            const rec = workRecords.find(r => r.id === id); if (!rec || !Array.isArray(rec.photos)) return;
            const photos = [...rec.photos]; photos.splice(photoIndex, 1);
            const { error } = await client.from('speedline_records').update({ photos }).eq('id', id);
            if (error) { alert('Ошибка удаления: ' + error.message); return; }
            rec.photos = photos; if (expandedCardId === id) renderExpandedContent(id);
        }

        // RENDER
        // ============================================
        function renderCardsList() {
            const cardsList = getEl('cardsList'); if (!cardsList) return;

                const q = searchQuery.toLowerCase().trim();
                filtered = workRecords.filter(r => (r.car_brand||'').toLowerCase().includes(q) || (r.vin||'').toLowerCase().includes(q) || (r.plate_number||'').toLowerCase().includes(q) || (r.client_name||'').toLowerCase().includes(q) || (r.client_phone||'').includes(q) || (r.date||'').includes(q) || formatDate(r.date).includes(q));
            }
            if (filtered.length === 0) {
                cardsList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔧</div><p>${searchQuery?'Ничего не найдено':'Нет записей. Добавьте первое авто!'}</p></div>`;
                return;
            }
            cardsList.innerHTML = filtered.map(rec => {
                const isExpanded = expandedCardId === rec.id;
                const statusInfo = STATUS_OPTIONS.find(s => s.value === rec.status) || STATUS_OPTIONS[0];
                const visits = getVisitsArr(rec);
                return `<div class="card-wrapper" id="cardWrapper_${rec.id}"><div class="compact-card ${isExpanded?'expanded':''}" onclick="toggleCardExpansion(${rec.id})"><span class="car-icon">🚗</span><div class="compact-info"><div class="compact-primary"><span class="compact-car">${escapeHTML(rec.car_brand||'Без марки')}</span>${rec.plate_number?`<span class="compact-plate">${escapeHTML(rec.plate_number)}</span>`:''}</div><div class="compact-secondary">${rec.client_name?`<span class="compact-client">👤 ${escapeHTML(rec.client_name)}</span>`:''}${rec.client_phone?`<span style="color:var(--text-secondary);font-size:0.7rem;">📱 ${escapeHTML(rec.client_phone)}</span>`:''}<span class="compact-date">📅 ${formatDate(rec.date)}</span>${visits.length>0?`<span class="compact-visits">🔄 ${visits.length}</span>`:''}</div></div><span class="status-badge status-${rec.status}">${statusInfo.label}</span><span class="expand-arrow">▼</span></div><div class="expanded-content" id="expandedContent_${rec.id}">${isExpanded?renderExpandedContentHTML(rec):''}</div></div>`;

        }

                        </div>

                            <div class="field"><div class="field-label">📅 Дата приёма</div><input type="date" value="${infoData.date||''}" ${infoDisabled} oninput="handleInfoChange(${rec.id},'date',this.value)"></div>

            let currentVisitHTML = '';
            if (hasCurrentWork) {
                let workItemsHTML = workItems.map((w, idx) => `
                    <div class="work-item">

                        ${totalMaterialCost > 0 ? `<div class="field"><div class="field-label">💰 Расходники</div><input value="${totalMaterialCost.toFixed(0)} €" disabled></div>` : ''}
                        ${isAdmin() ? `

            let allVisitsTotal = 0;
            visits.forEach(v => { const vw = parseWorkDescription(v.work_description); allVisitsTotal += vw.reduce((s,w) => s+(parseFloat(w.cost)||0),0) + (parseFloat(v.material_cost)||0); });
            const currentTotal = (parseFloat(rec.work_cost)||0) + (parseFloat(rec.material_cost)||0);
            const allTimeTotal = currentTotal + allVisitsTotal;

            let visitsHTML = `<div class="section-title visit-section"><span>📋 История обслуживания (${visits.length})</span></div><div class="field-group">`;

            if (visits.length > 0) {

                    visitsHTML += `
                    <div class="visit-block" data-visit-index="${idx}">

                                <button class="add-work-btn" onclick="addVisitWorkItem(${rec.id},${idx})">➕ Работа</button>
                                <div class="field"><div class="field-label" style="margin-top:4px;">💰 Работы: ${vWorkCost.toFixed(0)} €</div></div>

                                <div style="display:flex;gap:8px;margin-top:8px;">

                                            ${visitInvoice.client_name ? `<div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:6px;">👤 ${escapeHTML(visitInvoice.client_name)}${visitInvoice.client_phone ? ' | 📱 '+escapeHTML(visitInvoice.client_phone) : ''}</div>` : ''}
                                            <table class="invoice-table">

                                            <div class="invoice-total-line"><span>Подытог:</span><span>${visitInvoice.subtotal.toFixed(0)} €</span></div>

                                <div style="display:flex;gap:8px;margin-top:8px;">
                                    ${!isCompleted ? `<button class="btn btn-edit" onclick="event.stopPropagation();startEditVisit(${rec.id},${idx})">✏️</button>` : ''}

            } else {
                visitsHTML += `<div style="color:var(--text-secondary);font-size:0.85rem;text-align:center;padding:12px;">Нет завершённых визитов</div>`;

            return `
                ${infoHTML}
                ${currentVisitHTML}
                ${visitsHTML}
                <div class="section-title">📸 Фотографии</div>
                <div class="photo-gallery">
                    ${photosList.map((url,pIdx) => `<div class="photo-thumb-wrap"><img src="${url}" class="photo-thumb" onclick="window.open('${url}','_blank')"><button class="photo-delete-btn" onclick="event.stopPropagation();deletePhoto(${rec.id},${pIdx})">✕</button></div>`).join('')}
                    <div class="add-photo-btn" onclick="triggerPhotoUpload(${rec.id})">＋</div>
                    <input type="file" id="fileInput_${rec.id}" class="hidden-file-input" accept="image/*" multiple onchange="uploadPhotos(${rec.id}, this)">

                <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(239,68,68,0.15);padding:12px;border-radius:8px;font-weight:700;font-size:1rem;"><span>💰 Итого по машине (все визиты):</span><span style="color:#ef4444;">${allTimeTotal.toFixed(0)} €</span></div>
                <div class="action-buttons">
                    ${isAdmin()?`<button class="btn btn-delete" onclick="event.stopPropagation();deleteRecord(${rec.id})">🗑️ Удалить авто</button>`:''}
                </div>`;
        }

        function renderExpandedContent(id) {
            const content = getEl(`expandedContent_${id}`); if (!content) return;
            const rec = workRecords.find(r => r.id === id); if (!rec) return;
            content.innerHTML = renderExpandedContentHTML(rec);
        }

        function toggleCardExpansion(id) {
            if (expandedCardId === id) { expandedCardId = null; }
            else { expandedCardId = id; }
            renderCardsList();
        }

        let searchTimeout;
        getEl('searchInput').addEventListener('input', function() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { searchQuery = this.value; expandedCardId = null; editingInfoId = null; editingVisitId = null; infoEditStates = {}; visitEditStates = {}; expandedVisitIds = {}; expandedInvoiceIds = {}; renderCardsList(); }, 200); });
