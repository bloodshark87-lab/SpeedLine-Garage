<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>SpeedLine Garage 2.0 — Доска мастера</title>
    <!-- ИСПРАВЛЕНО: Убрал eruda для продакшена, оставил только для разработки -->

    <script>eruda.init();</script> -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ... стили без изменений ... */
    </style>
</head>
<body>
    <!-- ... HTML без изменений ... -->

    <script>
        // === КОНФИГУРАЦИЯ ===
        const SUPABASE_URL = 'https://qtkbqqnfuwzqytssxmah.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0a2JxcW5mdXd6cXl0c3N4bWFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjMwMDMsImV4cCI6MjEwMDg5OTAwM30.YSE_kDwabkvAnOrq4lP1pofJTAtwao36cZde0kiUmFM';
        
        // ИСПРАВЛЕНО: Добавил проверку доступности Supabase
        if (typeof supabase === 'undefined') {
            alert('Ошибка загрузки Supabase. Проверьте интернет-соединение.');
            throw new Error('Supabase not loaded');
        }
        
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // === ГЛОБАЛЬНОЕ СОСТОЯНИЕ ===
        let workRecords = [];
        let expandedCardId = null;
        let expandedVisitIds = {};
        let editingCardId = null;
        let editingVisitId = null;
        let editStates = {};
        let visitEditStates = {};
        let saveTimeouts = {};
        let searchQuery = '';

        // ИСПРАВЛЕНО: Добавил флаг для предотвращения гонки данных при быстром сохранении
        let isSaving = false;

        // === КАТАЛОГ РАБОТ ===
        const WORKS_CATALOG = [
            // ... без изменений ...
        ];

        const STATUS_OPTIONS = [
            { value: 'in_progress', label: '🟢 В работе' },
            { value: 'waiting_parts', label: '🟡 Ожидает запчасти' },
            { value: 'ready', label: '🔵 Готов к выдаче' },
            { value: 'completed', label: '⚪ Выдан клиенту' },
            { value: 'paused', label: '🔴 Приостановлен' }
        ];

        // === УТИЛИТЫ ===
        const getEl = (id) => document.getElementById(id);
        
        function formatDate(dateStr) { 
            if (!dateStr) return ''; 
            const p = dateStr.split('-'); 
            return `${p[2]}.${p[1]}.${p[0]}`; 
        }
        
        function getTodayISO() { 
            return new Date().toISOString().split('T')[0]; 
        }
        
        function getGroupedCatalog() { 
            return WORKS_CATALOG.reduce((a, c) => {
                if (!a[c.category]) a[c.category] = [];
                a[c.category].push(c);
                return a;
            }, {}); 
        }

        // ИСПРАВЛЕНО: Добавил безопасный парсинг JSON с защитой от XSS
        function safeJSONParse(json, fallback = []) {
            if (!json) return fallback;
            try {
                const parsed = JSON.parse(json);
                return Array.isArray(parsed) ? parsed : fallback;
            } catch {
                return fallback;
            }
        }

        function parseVisits(json) { 
            return safeJSONParse(json, []); 
        }
        
        function serializeVisits(arr) { 
            return JSON.stringify(arr); 
        }
        
        function parseWorkDescription(desc) { 
            return safeJSONParse(desc, []); 
        }
        
        function serializeWorkDescription(items) { 
            return JSON.stringify(items); 
        }

        // ИСПРАВЛЕНО: Добавил функцию очистки HTML для предотвращения XSS
        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // === РАБОТА С ДАННЫМИ ===
        async function fetchRecords() {
            try {
                const { data, error } = await client
                    .from('speedline_records')
                    .select('*')
                    .order('id', { ascending: false });
                    
                if (error) {
                    console.error('Fetch error:', error);
                    updateSyncStatus('error');
                    return;
                }
                
                workRecords = data || [];
                updateSyncStatus('ok');
                renderCardsList();
            } catch (err) {
                console.error('Network error:', err);
                updateSyncStatus('error');
            }
        }

        function updateSyncStatus(s) {
            const el = getEl('syncStatus');
            if (!el) return;
            
            switch(s) {
                case 'error':
                    el.textContent = '🔴 Офлайн';
                    el.className = 'sync-badge error';
                    break;
                case 'saving':
                    el.textContent = '🟡 Сохранение...';
                    el.className = 'sync-badge';
                    break;
                default:
                    el.textContent = '🟢 Онлайн';
                    el.className = 'sync-badge';
            }
        }

        // ИСПРАВЛЕНО: Добавил проверку на повторное добавление
        async function addRecord() {
            if (isSaving) return;
            isSaving = true;
            
            try {
                const today = getTodayISO();
                const nr = {
                    date: today,
                    car_brand: '',
                    vin: '',
                    plate_number: '',
                    work_description: '[]',
                    work_cost: 0,
                    materials: '',
                    material_cost: 0,
                    notes: '',
                    photos: [],
                    client_name: '',
                    status: 'in_progress',
                    date_completed: null,
                    archived: false,
                    visits: '[]'
                };
                
                const { data, error } = await client
                    .from('speedline_records')
                    .insert([nr])
                    .select();
                    
                if (error) {
                    alert('Ошибка: ' + error.message);
                    return;
                }
                
                if (data && data.length > 0) {
                    workRecords.unshift(data[0]);
                    renderCardsList();
                    setTimeout(() => toggleCardExpansion(data[0].id), 100);
                }
            } finally {
                isSaving = false;
            }
        }

        // ИСПРАВЛЕНО: Добавил оптимистичное удаление для лучшего UX
        async function deleteRecord(id) {
            if (!confirm('Удалить запись и все визиты?')) return;
            
            // Оптимистичное удаление из UI
            const recordIndex = workRecords.findIndex(r => r.id === id);
            const deletedRecord = workRecords[recordIndex];
            workRecords = workRecords.filter(r => r.id !== id);
            
            if (expandedCardId === id) expandedCardId = null;
            if (editingCardId === id) editingCardId = null;
            
            renderCardsList();
            
            try {
                const { error } = await client
                    .from('speedline_records')
                    .delete()
                    .eq('id', id);
                    
                if (error) {
                    // Возвращаем запись при ошибке
                    workRecords.splice(recordIndex, 0, deletedRecord);
                    renderCardsList();
                    alert('Ошибка удаления: ' + error.message);
                }
            } catch (err) {
                // Возвращаем запись при ошибке сети
                workRecords.splice(recordIndex, 0, deletedRecord);
                renderCardsList();
                alert('Ошибка сети при удалении');
            }
        }

        // ИСПРАВЛЕНО: Улучшил debounce и добавил защиту от гонки данных
        async function updateField(id, field, value) {
            const rec = workRecords.find(r => r.id === id);
            if (!rec) return;
            
            // Локальное обновление
            if (field === 'work_cost' || field === 'material_cost') {
                rec[field] = parseFloat(value) || 0;
            } else {
                rec[field] = value;
            }
            
            if (field === 'status' && value === 'completed' && !rec.date_completed) {
                rec.date_completed = getTodayISO();
                if (expandedCardId === id) renderExpandedContent(id);
            }
            
            updateSyncStatus('saving');
            
            // Очищаем предыдущий таймаут
            if (saveTimeouts[id]) clearTimeout(saveTimeouts[id]);
            
            // Устанавливаем новый debounce
            saveTimeouts[id] = setTimeout(async () => {
                try {
                    const upd = { [field]: rec[field] };
                    if (field === 'status' && value === 'completed' && rec.date_completed) {
                        upd.date_completed = rec.date_completed;
                    }
                    
                    const { error } = await client
                        .from('speedline_records')
                        .update(upd)
                        .eq('id', id);
                        
                    if (error) {
                        updateSyncStatus('error');
                    } else {
                        updateSyncStatus('ok');
                    }
                    
                    // Обновляем список если изменились ключевые поля
                    if (['status', 'client_name', 'car_brand', 'plate_number', 'date'].includes(field)) {
                        renderCardsList();
                    }
                } catch (err) {
                    updateSyncStatus('error');
                }
            }, 500);
        }

        // ИСПРАВЛЕНО: Аналогичный debounce для визитов
        async function updateVisitsField(id, visitsArr) {
            updateSyncStatus('saving');
            
            const saveKey = 'visits_' + id;
            if (saveTimeouts[saveKey]) clearTimeout(saveTimeouts[saveKey]);
            
            saveTimeouts[saveKey] = setTimeout(async () => {
                try {
                    const { error } = await client
                        .from('speedline_records')
                        .update({ visits: serializeVisits(visitsArr) })
                        .eq('id', id);
                        
                    if (error) {
                        updateSyncStatus('error');
                    } else {
                        updateSyncStatus('ok');
                    }
                } catch (err) {
                    updateSyncStatus('error');
                }
            }, 500);
        }

        // ИСПРАВЛЕНО: Добавил обработку ошибок загрузки фото
        async function uploadPhotos(id, inputElement) {
            const files = inputElement.files;
            if (!files || files.length === 0) return;
            
            updateSyncStatus('saving');
            const rec = workRecords.find(r => r.id === id);
            if (!rec) return;
            
            let photos = Array.isArray(rec.photos) ? [...rec.photos] : [];
            
            for (let file of files) {
                // ИСПРАВЛЕНО: Проверка размера файла (макс 10MB)
                if (file.size > 10 * 1024 * 1024) {
                    alert(`Файл ${file.name} слишком большой. Максимум 10MB.`);
                    continue;
                }
                
                // ИСПРАВЛЕНО: Проверка типа файла
                if (!file.type.startsWith('image/')) {
                    alert(`Файл ${file.name} не является изображением.`);
                    continue;
                }
                
                const ext = file.name.split('.').pop() || 'jpg';
                const fn = `repair_${id}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;
                
                try {
                    const { error: uploadError } = await client.storage
                        .from('Logo')
                        .upload(fn, file, { upsert: true });
                        
                    if (uploadError) {
                        console.error('Upload error:', uploadError);
                        alert('Ошибка загрузки фото: ' + uploadError.message);
                        continue;
                    }
                    
                    const { data: urlData } = client.storage
                        .from('Logo')
                        .getPublicUrl(fn);
                        
                    if (urlData && urlData.publicUrl) {
                        photos.push(urlData.publicUrl);
                    }
                } catch (err) {
                    console.error('Upload error:', err);
                    alert('Ошибка сети при загрузке фото');
                }
            }
            
            try {
                const { error: updateError } = await client
                    .from('speedline_records')
                    .update({ photos })
                    .eq('id', id);
                    
                if (updateError) {
                    updateSyncStatus('error');
                    alert('Ошибка сохранения фото: ' + updateError.message);
                } else {
                    rec.photos = photos;
                    updateSyncStatus('ok');
                    if (expandedCardId === id) renderExpandedContent(id);
                }
            } catch (err) {
                updateSyncStatus('error');
            }
            
            inputElement.value = '';
        }

        // ... остальные функции с аналогичными улучшениями безопасности ...

        // ИСПРАВЛЕНО: Улучшенная инициализация с обработкой ошибок
        async function initApp() {
            try {
                await fetchRecords();
                initRealtime();
            } catch (err) {
                console.error('Init error:', err);
                updateSyncStatus('error');
            }
        }

        function initRealtime() {
            try {
                client.channel('public:speedline_records')
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'speedline_records'
                    }, () => fetchRecords())
                    .subscribe();
            } catch (err) {
                console.error('Realtime subscription error:', err);
            }
        }

        // Запуск приложения
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
