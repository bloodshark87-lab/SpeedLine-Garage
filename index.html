        .compact-primary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

        .action-buttons{display:flex;gap:8px;flex-wrap:wrap;}
        .btn{padding:10px 16px;border-radius:4px;font-weight:700;font-size:0.85rem;cursor:pointer;border:none;font-family:var(--font-hud);text-transform:uppercase;flex:1;min-width:80px;text-align:center;}
        .btn-save{background:var(--neon-pink);color:#fff;}
        .btn-edit{background:rgba(0,240,255,0.1);color:var(--text-primary);border:1px solid rgba(0,240,255,0.25);}
        .btn-delete{background:rgba(255,42,109,0.15);color:var(--neon-pink);border:1px solid rgba(255,42,109,0.3);}
        .hidden-file-input{display:none;}
        .empty-state{text-align:center;padding:40px;color:var(--text-secondary);}
        .empty-state-icon{font-size:3rem;margin-bottom:12px;}
        @media(max-width:480px){.header{padding:10px 12px;}.field-row{grid-template-columns:1fr;}}
    </style>
</head>

    function getTodayISO() { return new Date().toISOString().split('T')[0]; }
    function parseJSON(j, fb) { if(!j) return fb; try { const p = JSON.parse(j); return Array.isArray(p) ? p : fb; } catch { return fb; } }
    function getVisits(r) { return r ? parseJSON(r.visits, []) : []; }
    function getEffectiveStatus(rec) { const visits = getVisits(rec); const active = visits.filter(v => v.status !== 'completed'); return active.length > 0 ? active[active.length-1].status : 'completed'; }
    function getInvoices(r) { return r ? parseJSON(r.invoice_data, []) : []; }
    function parseWorks(d) { return parseJSON(d, []); }
    function getGroupedCatalog() { return WORKS_CATALOG.reduce((a,c) => { if(!a[c.category]) a[c.category]=[]; a[c.category].push(c); return a; }, {}); }
    function groupWorksByCategory(items) { const g = {}; items.forEach(w => { const ci = WORKS_CATALOG.find(c => c.name===w.name); const cat = ci?ci.category:'Прочее'; if(!g[cat]) g[cat]=[]; g[cat].push(w); }); return g; }

    async function closeVisitAndCreateInvoice(rid, idx) {
        if (!isAdmin()) { alert('Только администратор может закрывать визиты'); return; }
        const r = workRecords.find(r => r.id === rid); if (!r) return;
        const visits = getVisits(r); const v = visits[idx]; if (!v) return;
        const discount = document.getElementById(`discount_${rid}_${idx}`)?.checked || false;
        const wItems = parseWorks(v.work_description);
        const wCost = wItems.reduce((s,w) => s+(parseFloat(w.cost)||0), 0);
        const mCost = parseFloat(v.material_cost)||0;
        const sub = wCost + mCost;
        const discAmt = discount ? Math.round(sub*0.1*100)/100 : 0;
        const total = sub - discAmt;
        const inv = { invoice_number: `INV-${rid}-${idx}-${Date.now().toString(36).toUpperCase()}`, invoice_date: getTodayISO(), car_brand: r.car_brand||'', plate_number: r.plate_number||'', client_name: r.client_name||'', client_phone: r.client_phone||'', visit_date: v.visit_date, mileage: v.mileage||'', works: wItems, work_cost: wCost, materials: v.materials||'', material_cost: mCost, subtotal: sub, discount_10: discount, discount_amount: discAmt, total };
        const invoices = getInvoices(r); invoices.push(inv);
        r.invoice_data = JSON.stringify(invoices);
        visits[idx].status = 'completed'; visits[idx].date_completed = getTodayISO(); visits[idx].work_cost = wCost;
        r.visits = JSON.stringify(visits);
        const { error } = await client.from('speedline_records').update({ visits: r.visits, invoice_data: r.invoice_data }).eq('id', rid);
        if (error) { alert('Ошибка: ' + error.message); return; }
        expandedInvoiceIds[`${rid}_${idx}`] = true;
        renderExpandedContent(rid);
    }

    async function uploadPhotos(id, inp) {
        const files = inp.files; if (!files?.length) return;
        const r = workRecords.find(r => r.id === id); if (!r) return;
        let photos = Array.isArray(r.photos) ? [...r.photos] : [];
        for (let f of files) {
            const fn = `repair_${id}_${Date.now()}_${Math.random().toString(36).substring(2,7)}.${f.name.split('.').pop()}`;
            const { error } = await client.storage.from('Logo').upload(fn, f, { upsert: true });
            if (error) continue;
            const { data } = client.storage.from('Logo').getPublicUrl(fn);
            if (data?.publicUrl) photos.push(data.publicUrl);
        }
        await client.from('speedline_records').update({ photos }).eq('id', id);
        r.photos = photos; if (expandedCardId === id) renderExpandedContent(id);
        inp.value = '';
    }

    function renderCardsList() {
        const el = getEl('cardsList'); if (!el) return;
        let list = workRecords;
        if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            list = workRecords.filter(r => (r.car_brand||'').toLowerCase().includes(q) || (r.vin||'').toLowerCase().includes(q) || (r.plate_number||'').toLowerCase().includes(q) || (r.client_name||'').toLowerCase().includes(q) || (r.client_phone||'').includes(q) || (r.date||'').includes(q) || formatDate(r.date).includes(q));
        }
        if (!list.length) { el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔧</div><p>${searchQuery?'Ничего не найдено':'Нет записей'}</p></div>`; return; }
        el.innerHTML = list.map(r => {
            const visits = getVisits(r);
            const effStatus = getEffectiveStatus(r);
            const st = STATUS_OPTIONS.find(s => s.value===effStatus) || STATUS_OPTIONS[3];
            return `<div class="card-wrapper"><div class="compact-card ${expandedCardId===r.id?'expanded':''}" onclick="toggleCardExpansion(${r.id})"><span class="car-icon">🚗</span><div class="compact-info"><div class="compact-primary"><span class="compact-car">${escapeHTML(r.car_brand||'Без марки')}</span>${r.plate_number?`<span class="compact-plate">${escapeHTML(r.plate_number)}</span>`:''}</div><div class="compact-secondary">${r.client_name?`<span class="compact-client">👤 ${escapeHTML(r.client_name)}</span>`:''}${r.client_phone?`<span style="color:var(--text-secondary);font-size:0.7rem;">📱 ${escapeHTML(r.client_phone)}</span>`:''}<span class="compact-date">📅 ${formatDate(r.date)}</span>${visits.length?`<span class="compact-visits">🔄 ${visits.length}</span>`:''}</div></div><span class="status-badge status-${effStatus}">${st.label}</span><span class="expand-arrow">▼</span></div><div class="expanded-content" id="ec_${r.id}">${expandedCardId===r.id?renderExpandedHTML(r):''}</div></div>`;
        }).join('');
    }

    function renderExpandedHTML(r) {
        const isEditInfo = editingInfoId === r.id;
        const infoS = infoEditStates[r.id] || {};
        const infoD = isEditInfo ? { ...r, ...infoS } : r;
        const dis = isEditInfo ? '' : 'disabled';
        const wItems = parseWorks(r.work_description);
        const photos = Array.isArray(r.photos) ? r.photos : [];
        const visits = getVisits(r);
        const invoices = getInvoices(r);
        const hasWork = wItems.length > 0;
        const cat = getGroupedCatalog();

        let infoHTML = `<div class="info-section"><div class="info-section-header"><span class="info-section-title">👤 Общая информация</span>${isEditInfo?`<div style="display:flex;gap:6px;"><button class="btn-edit-info" style="background:var(--accent);color:white;" onclick="event.stopPropagation();saveInfo(${r.id})">💾 Сохранить</button><button class="btn-edit-info" onclick="event.stopPropagation();cancelEditInfo(${r.id})">↩ Отменить</button></div>`:`<button class="btn-edit-info" onclick="event.stopPropagation();startEditInfo(${r.id})">✏️ Редактировать</button>`}</div><div class="field-group"><div class="field-row"><div class="field"><div class="field-label">🚗 Марка авто</div><input value="${escapeHTML(infoD.car_brand||'')}" ${dis} oninput="handleInfoChange(${r.id},'car_brand',this.value)"></div><div class="field"><div class="field-label">🔢 Госномер</div><input value="${escapeHTML(infoD.plate_number||'')}" ${dis} style="text-transform:uppercase;" oninput="handleInfoChange(${r.id},'plate_number',this.value)"></div></div><div class="field-row"><div class="field"><div class="field-label">👤 ФИО клиента</div><input value="${escapeHTML(infoD.client_name||'')}" ${dis} oninput="handleInfoChange(${r.id},'client_name',this.value)"></div><div class="field"><div class="field-label">📱 Телефон</div><input value="${escapeHTML(infoD.client_phone||'')}" ${dis} oninput="handleInfoChange(${r.id},'client_phone',this.value)"></div></div><div class="field-row"><div class="field"><div class="field-label">🧬 VIN</div><input value="${escapeHTML(infoD.vin||'')}" ${dis} style="text-transform:uppercase;" oninput="handleInfoChange(${r.id},'vin',this.value)"></div><div class="field"><div class="field-label">📅 Дата приёма</div><input type="date" value="${infoD.date||''}" ${dis} oninput="handleInfoChange(${r.id},'date',this.value)"></div></div></div></div>`;

        let curHTML = '';
        if (hasWork) {
            const wHTML = wItems.map(w => `<div class="work-item"><span style="flex:1;font-size:0.85rem;">${escapeHTML(w.name)}</span><span style="color:var(--text-secondary);font-weight:600;">${(parseFloat(w.cost)||0).toFixed(0)} €</span></div>`).join('');
            const twc = wItems.reduce((s,w) => s+(parseFloat(w.cost)||0), 0);
            const tmc = parseFloat(r.material_cost)||0;
            curHTML = `<div class="section-title">🔧 Текущий визит</div><div class="field-group">${wHTML}<div class="field-row"><div class="field"><div class="field-label">💵 Работы</div><input value="${twc.toFixed(0)} €" disabled></div><div class="field"></div></div>${r.materials?`<div class="field"><div class="field-label">🔩 Расходники</div><div style="font-size:0.85rem;padding:8px;background:rgba(0,0,0,0.2);border-radius:4px;">${escapeHTML(r.materials)}</div></div>`:''}${tmc>0?`<div class="field"><div class="field-label">💰 Расходники</div><input value="${tmc.toFixed(0)} €" disabled></div>`:''}${isAdmin()?`<div class="discount-checkbox-wrap"><input type="checkbox" id="discount_current_${r.id}"><label for="discount_current_${r.id}">Скидка 10%</label></div><button class="btn-close-visit" onclick="event.stopPropagation();closeCurrentVisitAndCreateInvoice(${r.id})">🔒 Завершить и создать счёт</button>`:''}</div>`;
        }

        let vTotal = 0; visits.forEach(v => { const vw = parseWorks(v.work_description); vTotal += vw.reduce((s,w) => s+(parseFloat(w.cost)||0),0) + (parseFloat(v.material_cost)||0); });
        const allTotal = ((parseFloat(r.work_cost)||0)+(parseFloat(r.material_cost)||0)) + vTotal;

        let visHTML = `<div class="section-title visit-section"><span>📋 История обслуживания (${visits.length})</span></div><div class="field-group">`;
        if (visits.length) {
            visits.forEach((v, idx) => {
                const key = `${r.id}_${idx}`;
                const isEdit = editingVisitId === key;
                const isOpen = expandedVisitIds[key];
                const invOpen = expandedInvoiceIds[key];
                const vs = visitEditStates[key] || {};
                const vd = isEdit ? { ...v, ...vs } : v;
                const vw = (isEdit && vs.work_description) ? parseWorks(vs.work_description) : parseWorks(v.work_description);
                const vwc = vw.reduce((s,w) => s+(parseFloat(w.cost)||0), 0);
                const vmc = parseFloat(vd.material_cost)||0;
                const vt = vwc + vmc;
                const st = STATUS_OPTIONS.find(s => s.value===vd.status) || STATUS_OPTIONS[0];
                const done = vd.status === 'completed';
                const inv = invoices.find(i => i.visit_date===v.visit_date && i.work_cost===vwc);

                visHTML += `<div class="visit-block"><div class="visit-header-row ${isOpen?'expanded':''}" onclick="event.stopPropagation();toggleVisitExpansion(${r.id},${idx})"><div class="visit-header-left"><span class="visit-header-date">📅 ${formatDate(vd.visit_date)}</span>${vd.mileage?`<span class="visit-header-mileage">🔢 ${vd.mileage} км</span>`:''}<span class="visit-header-status status-${vd.status}">${st.label}</span>${inv?'<span style="font-size:0.7rem;color:var(--info);">🧾</span>':''}</div><span class="visit-header-total">${vt.toFixed(0)} €</span><span class="visit-header-arrow">▼</span></div><div class="visit-body-content ${isOpen?'open':''}">${isEdit?`<div class="field-row"><div class="field"><div class="field-label">📅 Дата</div><input type="date" value="${vd.visit_date||''}" oninput="handleVisitEditChange(${r.id},${idx},'visit_date',this.value)"></div><div class="field"><div class="field-label">🔢 Пробег</div><input type="number" value="${vd.mileage||''}" oninput="handleVisitEditChange(${r.id},${idx},'mileage',this.value)"></div></div><div class="field"><div class="field-label">📌 Статус</div><select onchange="handleVisitEditChange(${r.id},${idx},'status',this.value)">${STATUS_OPTIONS.map(s => `<option value="${s.value}" ${vd.status===s.value?'selected':''}>${s.label}</option>`).join('')}</select></div><div class="field-label" style="margin-top:4px;">🔧 Работы</div>${vw.map((w,wi) => `<div class="work-item"><select onchange="updateVisitWorkItem(${r.id},${idx},${wi},'name',this.value)">${Object.entries(cat).map(([c,items]) => `<optgroup label="${escapeHTML(c)}">${items.map(i => `<option value="${escapeHTML(i.name)}" ${w.name===i.name?'selected':''}>${escapeHTML(i.name)} (${i.cost}€)</option>`).join('')}</optgroup>`).join('')}</select><input type="number" class="work-cost" value="${w.cost}" oninput="updateVisitWorkItem(${r.id},${idx},${wi},'cost',this.value)"><button class="remove-work-btn" onclick="removeVisitWorkItem(${r.id},${idx},${wi})">✕</button></div>`).join('')}<button class="add-work-btn" onclick="addVisitWorkItem(${r.id},${idx})">➕ Работа</button><div class="field"><div class="field-label" style="margin-top:4px;">💰 Работы: ${vwc.toFixed(0)} €</div></div><div class="field"><div class="field-label">🔩 Расходники</div><textarea rows="2" oninput="handleVisitEditChange(${r.id},${idx},'materials',this.value)">${escapeHTML(vd.materials||'')}</textarea></div><div class="field"><div class="field-label">💰 Стоимость (€)</div><input type="number" value="${vmc}" oninput="handleVisitEditChange(${r.id},${idx},'material_cost',this.value)"></div><div class="field"><div class="field-label">📝 Заметки</div><textarea rows="2" oninput="handleVisitEditChange(${r.id},${idx},'notes',this.value)">${escapeHTML(vd.notes||'')}</textarea></div><div style="display:flex;gap:8px;margin-top:8px;"><button class="btn btn-save" onclick="event.stopPropagation();saveVisit(${r.id},${idx})">💾 Сохранить</button><button class="btn btn-edit" onclick="event.stopPropagation();cancelEditVisit(${r.id},${idx})">↩ Отменить</button>${isAdmin()?`<button class="btn-delete-visit" onclick="event.stopPropagation();deleteVisit(${r.id},${idx})">🗑️</button>`:''}</div>`:`<div class="field-row"><div class="field"><div class="field-label">📅 Дата</div><input value="${formatDate(v.visit_date)}" disabled></div><div class="field"><div class="field-label">🔢 Пробег</div><input value="${v.mileage?v.mileage+' км':'—'}" disabled></div></div><div class="field"><div class="field-label">📌 Статус</div><input value="${st.label}" disabled></div>${!done && isAdmin()?`<div class="discount-checkbox-wrap"><input type="checkbox" id="discount_${r.id}_${idx}"><label for="discount_${r.id}_${idx}">Скидка 10%</label></div><button class="btn-close-visit" onclick="event.stopPropagation();closeVisitAndCreateInvoice(${r.id},${idx})">🔒 Закрыть визит и создать счёт</button>`:''}${inv?`<button class="btn-invoice-toggle" onclick="event.stopPropagation();toggleInvoiceDisplay(${r.id},${idx})">${invOpen?'📊 Скрыть счёт':'🧾 Показать счёт'}</button>${invOpen?`<div class="invoice-box"><div class="invoice-title">📋 СЧЁТ-ФАКТУРА №${inv.invoice_number}</div><div style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:6px;">🚗 ${escapeHTML(inv.car_brand)} ${escapeHTML(inv.plate_number)} | 📅 ${formatDate(inv.invoice_date)}</div>${inv.client_name?`<div style="font-size:0.78rem;color:var(--text-secondary);">👤 ${escapeHTML(inv.client_name)}${inv.client_phone?' | 📱 '+escapeHTML(inv.client_phone):''}</div>`:''}<table class="invoice-table"><thead><tr><th>Категория</th><th>Наименование</th><th>Сумма</th></tr></thead><tbody>${Object.entries(groupWorksByCategory(inv.works)).map(([cat,items]) => `<tr class="invoice-category-row"><td colspan="3">${escapeHTML(cat)}</td></tr>${items.map(w => `<tr><td></td><td>${escapeHTML(w.name)}</td><td>${(parseFloat(w.cost)||0).toFixed(0)} €</td></tr>`).join('')}`).join('')}</tbody></table><div class="invoice-total-line"><span>💵 Работы:</span><span>${inv.work_cost.toFixed(0)} €</span></div>${inv.materials?`<div class="invoice-total-line"><span>🔩 Расходники:</span><span>${inv.material_cost.toFixed(0)} €</span></div>`:''}<div class="invoice-total-line"><span>Подытог:</span><span>${inv.subtotal.toFixed(0)} €</span></div>${inv.discount_10?`<div class="invoice-discount-line"><span>🔖 Скидка 10%:</span><span>-${inv.discount_amount.toFixed(0)} €</span></div>`:''}<div class="invoice-final-line"><span>💰 ИТОГО:</span><span>${inv.total.toFixed(0)} €</span></div><div style="text-align:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);"><button class="btn-pdf-download" onclick="event.stopPropagation();downloadInvoicePDF(${r.id},${idx})">📥 Скачать PDF</button></div></div>`:''}`:''}<div style="display:flex;gap:8px;margin-top:8px;">${!done?`<button class="btn btn-edit" onclick="event.stopPropagation();startEditVisit(${r.id},${idx})">✏️</button>`:''}${isAdmin()?`<button class="btn-delete-visit" onclick="event.stopPropagation();deleteVisit(${r.id},${idx})">🗑️</button>`:''}</div>`}</div></div>`;
            });
        } else { visHTML += `<div style="color:var(--text-secondary);font-size:0.85rem;text-align:center;padding:12px;">Нет завершённых визитов</div>`; }
        visHTML += `<button class="visit-new-btn" onclick="event.stopPropagation();addVisit(${r.id})">🔄 Новый визит</button></div>`;

        return `${infoHTML}${curHTML}${visHTML}<div class="section-title">📸 Фотографии</div><div class="photo-gallery">${photos.map((url,pi) => `<div class="photo-thumb-wrap"><img src="${url}" class="photo-thumb" onclick="window.open('${url}','_blank')"><button class="photo-delete-btn" onclick="event.stopPropagation();deletePhoto(${r.id},${pi})">✕</button></div>`).join('')}<div class="add-photo-btn" onclick="triggerPhotoUpload(${r.id})">＋</div><input type="file" id="fileInput_${r.id}" class="hidden-file-input" accept="image/*" multiple onchange="uploadPhotos(${r.id}, this)"></div><div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,42,109,0.1);padding:14px;border-radius:4px;font-weight:800;font-size:1.1rem;border:1px solid rgba(255,42,109,0.2);font-family:var(--font-hud);"><span>💰 Итого по машине:</span><span style="color:var(--neon-pink);">${allTotal.toFixed(0)} €</span></div><div class="action-buttons">${isAdmin()?`<button class="btn btn-delete" onclick="event.stopPropagation();deleteRecord(${r.id})">🗑️ Удалить авто</button>`:''}</div>`;
    }

    function renderExpandedContent(id) { const el = getEl(`ec_${id}`); if (!el) return; const r = workRecords.find(r => r.id === id); if (!r) return; el.innerHTML = renderExpandedHTML(r); }
    function toggleCardExpansion(id) { expandedCardId = expandedCardId === id ? null : id; renderCardsList(); }

    let searchTimeout;
    getEl('searchInput').addEventListener('input', function() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { searchQuery = this.value; expandedCardId = null; editingInfoId = null; editingVisitId = null; infoEditStates = {}; visitEditStates = {}; expandedVisitIds = {}; expandedInvoiceIds = {}; renderCardsList(); }, 200); });
    getEl('addBtn').addEventListener('click', addRecord);

    function initRealtime() { client.channel('public:speedline_records').on('postgres_changes', { event: '*', schema: 'public', table: 'speedline_records' }, () => fetchRecords()).subscribe(); }

    (async function init() { if (!await checkSession()) return; await fetchRecords(); initRealtime(); })();
</script>
</body>
</html>
