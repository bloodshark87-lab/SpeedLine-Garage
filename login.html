<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedLine Garage — Вход</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        // Eruda запускается сразу и показывается
        eruda.init();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-sub {
            font-size: 0.65rem;
            color: #94a3b8;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.5; cursor: default; }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show { display: block; }

        .setup-hint {
            text-align: center;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 24px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://qtkbqqnfuwzqytssxmah.supabase.co/storage/v1/object/public/Logo/IMG_20260729_174121.jpg" alt="Logo" class="logo-img">
            <div class="logo-text">SpeedLine Garage</div>
            <div class="logo-sub">доска мастера</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="loginUsername" placeholder="Введите логин" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Войти</button>
        </form>

        <div class="setup-hint">
            Логин: <strong>yura</strong><br>
            Пароль: <strong>yura1987</strong>
        </div>
    </div>

    <script>
        // Supabase config
        const SUPABASE_URL = 'https://qtkbqqnfuwzqytssxmah.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0a2JxcW5mdXd6cXl0c3N4bWFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjMwMDMsImV4cCI6MjEwMDg5OTAwM30.YSE_kDwabkvAnOrq4lP1pofJTAtwao36cZde0kiUmFM';
        
        console.log('Supabase init start');
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('Supabase client created');

        const errorMsg = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        // Проверяем сессию
        async function checkSession() {
            console.log('Checking session...');
            const { data: { session }, error } = await client.auth.getSession();
            console.log('Session check result:', { session: !!session, error: error?.message });
            if (session) {
                console.log('Already logged in, redirecting to index.html');
                window.location.href = 'index.html';
            }
        }
        checkSession();

        // Логин
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            console.log('Login attempt:', { username, passwordLength: password.length });
            
            if (!username || !password) {
                console.log('Empty fields');
                showError('Заполните все поля');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';
            errorMsg.classList.remove('show');

            const email = `${username.toLowerCase()}@speedline.local`;
            console.log('Attempting sign in with:', { email });
            
            const { data, error } = await client.auth.signInWithPassword({ 
                email: email, 
                password: password 
            });

            console.log('Sign in result:', { 
                success: !!data?.user, 
                error: error?.message,
                errorStatus: error?.status,
                userId: data?.user?.id 
            });

            if (error) {
                showError('Неверный логин или пароль');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            } else {
                const role = data.user?.user_metadata?.role || 'master';
                const username = data.user?.user_metadata?.username || username;
                console.log('Login successful, role:', role);
                localStorage.setItem('userRole', role);
                localStorage.setItem('username', username);
                window.location.href = 'index.html';
            }
        });

        function showError(msg) {
            console.log('Showing error:', msg);
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }
    </script>
</body>
</html>
