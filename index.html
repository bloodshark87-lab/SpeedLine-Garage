<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Спидлайн Гараж — Общая база данных</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; padding: 10px; color: #e0e0e0; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 100%; margin: 0 auto; background: rgba(22, 33, 62, 0.7); backdrop-filter: blur(20px); border-radius: 16px; padding: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); }
        .header-section { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #e94560, #c23152); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4); flex-shrink: 0; }
        .company-name { font-size: 1.1rem; font-weight: 700; color: #ffffff; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.2; }
        .company-subtitle { font-size: 0.7rem; color: #a0a0a0; letter-spacing: 0.5px; }
        .sync-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: rgba(0, 255, 100, 0.15); color: #00ff64; border: 1px solid rgba(0, 255, 100, 0.3); }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
        .stat-card { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: #a0a0a0; margin-bottom: 4px; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: #ff6b6b; }
        .controls { display: flex; gap: 10px; margin-bottom: 16px; }
        .add-btn { background: linear-gradient(135deg, #e94560, #c23152); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.3); margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; min-width: 1050px; }
        th { background: rgba(22, 33, 62, 0.95); padding: 10px 8px; text-align: left; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; border-bottom: 2px solid rgba(233, 69, 96, 0.3); position: sticky; top: 0; z-index: 10; color: #ff6b6b; }
        td { padding: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.85rem; }
        input, textarea { width: 100%; padding: 8px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; color: #fff; font-size: 0.85rem; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #e94560; box-shadow: 0 0 0 2px rgba(233, 69, 96, 0.2); }
        input[type="number"] { text-align: right; }
        textarea { resize: vertical; min-height: 36px; }
        .delete-btn { background: rgba(255, 75, 75, 0.2); color: #ff4b4b; border: 1px solid rgba(255, 75, 75, 0.3); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .total-row { background: rgba(233, 69, 96, 0.15); font-weight: 700; border-top: 2px solid rgba(233, 69, 96, 0.5); }
        .total-row td { padding: 12px 8px; color: #ff6b6b; }
        
        .cards-container { display: none; flex-direction: column; gap: 14px; margin-bottom: 16px; }
        .card { background: rgba(0, 0, 0, 0.35); border-radius: 14px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.12); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-number { font-weight: 700; color: #ff6b6b; background: rgba(233, 69, 96, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.9rem; }
        .card-field { margin-bottom: 10px; }
        .card-label { font-size: 0.7rem; text-transform: uppercase; color: #a0a0a0; margin-bottom: 4px; font-weight: 600; }
        .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-total { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); font-weight: 700; color: #ff6b6b; }
        .grand-total-card { background: rgba(233, 69, 96, 0.2); border-radius: 14px; padding: 16px; border: 1px solid rgba(233, 69, 96, 0.3); display: none; justify-content: space-between; align-items: center; font-weight: 700; font-size: 1rem; color: #ffffff; margin-bottom: 16px; }
        .grand-total-value { font-size: 1.2rem; color: #ff6b6b; }

        @media screen and (max-width: 768px) {
            .table-wrapper { display: none; }
            .cards-container { display: flex; }
            .grand-total-card { display: flex; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <div class="logo-area">
                <div class="logo-icon">🏎️</div>
                <div>
                    <div class="company-name">Спидлайн Гараж</div>
                    <div class="company-subtitle">общая база данных</div>
                </div>
            </div>
            <div id="syncStatus" class="sync-status">🟢 Подключение...</div>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-label">📌 Записей</div><div class="stat-value" id="totalRecords">0</div></div>
            <div class="stat-card"><div class="stat-label">💰 Работы</div><div class="stat-value" id="totalWorkCost">0 €</div></div>
            <div class="stat-card"><div class="stat-label">🔩 Расходники</div><div class="stat-value" id="totalMaterialCost">0 €</div></div>
            <div class="stat-card"><div class="stat-label">🧾 ИТОГО</div><div class="stat-value" id="totalSum">0 €</div></div>
        </div>

        <div class="controls">
            <button class="add-btn" id="addBtn">➕ Добавить запись</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width:45px;">№</th>
                        <th style="width:115px;">📅 Дата</th>
                        <th>🚗 Марка авто</th>
                        <th style="width:170px;">🧬 VIN</th>
                        <th style="width:100px;">🔢 Госномер</th>
                        <th>🔧 Работы</th>
                        <th style="width:100px;">💵 Работа (€)</th>
                        <th>🔩 Расходники</th>
                        <th style="width:110px;">💰 Мат. (€)</th>
                        <th>📝 Заметки</th>
                        <th style="width:70px;">⚙️</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="6" style="text-align:right;">🧾 ИТОГО:</td>
                        <td id="footerWorkTotal">0 €</td>
                        <td></td>
                        <td id="footerMaterialTotal">0 €</td>
                        <td id="footerGrandTotal" colspan="2">0 €</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="cards-container" id="cardsContainer"></div>
        <div class="grand-total-card" id="grandTotalCardContainer">
            <span>🧾 ИТОГО ПО ВСЕМ</span>
            <span class="grand-total-value" id="mobileGrandTotal">0 €</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qtkbqqnfuwzqytssxmah.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0a2JxcW5mdXd6cXl0c3N4bWFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjMwMDMsImV4cCI6MjEwMDg5OTAwM30.YSE_kDwabkvAnOrq4lP1pofJTAtwao36cZde0kiUmFM';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let workRecords = [];
        let saveTimeouts = {};

        const getEl = (id) => document.getElementById(id);

        async function fetchRecords() {
            const { data, error } = await client
                .from('speedline_records')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error('Ошибка загрузки:', error);
                getEl('syncStatus').textContent = '🔴 Ошибка связи';
                getEl('syncStatus').style.background = 'rgba(255,0,0,0.15)';
                getEl('syncStatus').style.color = '#ff4b4b';
                return;
            }

            workRecords = data || [];
            renderAll();
            getEl('syncStatus').textContent = '🟢 Синхронизировано';
        }

        async function addRow() {
            const today = new Date().toISOString().split('T')[0];
            const newRecord = {
                date: today,
                car_brand: '',
                vin: '',
                plate_number: '',
                work_description: '',
                work_cost: 0,
                materials: '',
                material_cost: 0,
                notes: ''
            };

            const { data, error } = await client
                .from('speedline_records')
                .insert([newRecord])
                .select();

            if (error) {
                alert('Ошибка добавления: ' + error.message);
                console.error('Supabase Insert Error:', error);
                return;
            }

            if (data && data.length > 0) {
                workRecords.push(data[0]);
                renderAll();
            }
        }

        async function deleteRow(id) {
            if (!confirm('Удалить эту запись из общей базы?')) return;

            const { error } = await client
                .from('speedline_records')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Ошибка удаления: ' + error.message);
                return;
            }

            workRecords = workRecords.filter(r => r.id !== id);
            renderAll();
        }

        function updateField(id, field, value) {
            const record = workRecords.find(r => r.id === id);
            if (!record) return;

            record[field] = (field === 'work_cost' || field === 'material_cost') ? (parseFloat(value) || 0) : value;
            updateStatsOnly();
            updateCardTotalUI(id);

            clearTimeout(saveTimeouts[id]);
            saveTimeouts[id] = setTimeout(async () => {
                const { error } = await client
                    .from('speedline_records')
                    .update({ [field]: record[field] })
                    .eq('id', id);

                if (error) {
                    console.error('Ошибка сохранения:', error);
                    getEl('syncStatus').textContent = '🟡 Ошибка сохранения';
                } else {
                    getEl('syncStatus').textContent = '🟢 Синхронизировано';
                }
            }, 500);
        }

        function updateCardTotalUI(id) {
            const card = document.querySelector(`.card[data-id="${id}"]`);
            if (!card) return;
            const record = workRecords.find(r => r.id === id);
            if (!record) return;
            const total = (parseFloat(record.work_cost) || 0) + (parseFloat(record.material_cost) || 0);
            const totalSpan = card.querySelector('.card-total-val');
            if (totalSpan) totalSpan.textContent = total.toFixed(0) + ' €';
        }

        function updateStatsOnly() {
            const totalCount = workRecords.length;
            getEl('totalRecords').textContent = totalCount;
            const tw = workRecords.reduce((s, r) => s + (parseFloat(r.work_cost) || 0), 0);
            const tm = workRecords.reduce((s, r) => s + (parseFloat(r.material_cost) || 0), 0);
            const grandTotal = tw + tm;
            
            getEl('totalWorkCost').textContent = tw.toFixed(0) + ' €';
            getEl('totalMaterialCost').textContent = tm.toFixed(0) + ' €';
            getEl('totalSum').textContent = grandTotal.toFixed(0) + ' €';
            
            getEl('footerWorkTotal').textContent = tw.toFixed(0) + ' €';
            getEl('footerMaterialTotal').textContent = tm.toFixed(0) + ' €';
            getEl('footerGrandTotal').textContent = grandTotal.toFixed(0) + ' €';
            
            const mobileGT = getEl('mobileGrandTotal');
            if (mobileGT) mobileGT.textContent = grandTotal.toFixed(0) + ' €';
        }

        function renderAll() {
            // Отрисовка десктопной таблицы
            const tbody = getEl('tableBody');
            if (tbody) {
                tbody.innerHTML = '';
                workRecords.forEach((rec, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="text-align:center;font-weight:600;color:#ff6b6b;">${index + 1}</td>
                        <td><input type="date" value="${rec.date || ''}" oninput="updateField(${rec.id}, 'date', this.value)"></td>
                        <td><input type="text" value="${rec.car_brand || ''}" placeholder="Марка" oninput="updateField(${rec.id}, 'car_brand', this.value)"></td>
                        <td><input type="text" value="${rec.vin || ''}" placeholder="VIN" style="text-transform:uppercase;" oninput="updateField(${rec.id}, 'vin', this.value)"></td>
                        <td><input type="text" value="${rec.plate_number || ''}" placeholder="Номер" style="text-transform:uppercase;" oninput="updateField(${rec.id}, 'plate_number', this.value)"></td>
                        <td><textarea rows="2" oninput="updateField(${rec.id}, 'work_description', this.value)">${rec.work_description || ''}</textarea></td>
                        <td><input type="number" value="${rec.work_cost || 0}" oninput="updateField(${rec.id}, 'work_cost', this.value)"></td>
                        <td><textarea rows="2" oninput="updateField(${rec.id}, 'materials', this.value)">${rec.materials || ''}</textarea></td>
                        <td><input type="number" value="${rec.material_cost || 0}" oninput="updateField(${rec.id}, 'material_cost', this.value)"></td>
                        <td><textarea rows="2" oninput="updateField(${rec.id}, 'notes', this.value)">${rec.notes || ''}</textarea></td>
                        <td style="text-align:center;"><button class="delete-btn" onclick="deleteRow(${rec.id})">🗑️</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Отрисовка мобильных карточек
            const cardsContainer = getEl('cardsContainer');
            if (cardsContainer) {
                cardsContainer.innerHTML = '';
                workRecords.forEach((rec, index) => {
                    const cardTotal = (parseFloat(rec.work_cost) || 0) + (parseFloat(rec.material_cost) || 0);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.id = rec.id;
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-number">#${index + 1}</span>
                            <span style="color:#a0a0a0; font-size:0.8rem;">📅 <input type="date" value="${rec.date || ''}" style="background:transparent; border:none; color:#a0a0a0; width:auto; display:inline;" oninput="updateField(${rec.id}, 'date', this.value)"></span>
                        </div>
                        <div class="card-field"><div class="card-label">🚗 Марка авто</div><input type="text" value="${rec.car_brand || ''}" placeholder="Марка" oninput="updateField(${rec.id}, 'car_brand', this.value)"></div>
                        <div class="card-row">
                            <div class="card-field"><div class="card-label">🧬 VIN</div><input type="text" value="${rec.vin || ''}" placeholder="VIN" style="text-transform:uppercase;" oninput="updateField(${rec.id}, 'vin', this.value)"></div>
                            <div class="card-field"><div class="card-label">🔢 Госномер</div><input type="text" value="${rec.plate_number || ''}" placeholder="Номер" style="text-transform:uppercase;" oninput="updateField(${rec.id}, 'plate_number', this.value)"></div>
                        </div>
                        <div class="card-field"><div class="card-label">🔧 Работы</div><textarea rows="2" oninput="updateField(${rec.id}, 'work_description', this.value)">${rec.work_description || ''}</textarea></div>
                        <div class="card-row">
                            <div class="card-field"><div class="card-label">💵 Работа (€)</div><input type="number" value="${rec.work_cost || 0}" oninput="updateField(${rec.id}, 'work_cost', this.value)"></div>
                            <div class="card-field"><div class="card-label">💰 Мат. (€)</div><input type="number" value="${rec.material_cost || 0}" oninput="updateField(${rec.id}, 'material_cost', this.value)"></div>
                        </div>
                        <div class="card-field"><div class="card-label">🔩 Расходники</div><textarea rows="2" oninput="updateField(${rec.id}, 'materials', this.value)">${rec.materials || ''}</textarea></div>
                        <div class="card-field"><div class="card-label">📝 Заметки</div><textarea rows="2" oninput="updateField(${rec.id}, 'notes', this.value)">${rec.notes || ''}</textarea></div>
                        <div class="card-total"><span>💰 Итого:</span><span class="card-total-val">${cardTotal.toFixed(0)} €</span></div>
                        <div style="margin-top: 10px;"><button class="delete-btn" style="width:100%; padding:10px;" onclick="deleteRow(${rec.id})">🗑️ Удалить запись</button></div>
                    `;
                    cardsContainer.appendChild(card);
                });
            }

            updateStatsOnly();
        }

        function initRealtime() {
            client
                .channel('public:speedline_records')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'speedline_records' }, payload => {
                    fetchRecords();
                })
                .subscribe();
        }

        getEl('addBtn').addEventListener('click', addRow);

        fetchRecords();
        initRealtime();
    </script>
</body>
</html>
