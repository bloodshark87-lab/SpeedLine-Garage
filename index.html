            padding: 0;
            color: var(--text-primary);

            background: rgba(15, 23, 42, 0.85);

            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;

                margin: 10px auto;
                min-height: calc(100vh - 20px);

            backdrop-filter: blur(20px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);

        .company-info {

            flex-direction: column;

        .company-name {

            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;

        .company-subtitle {

            backdrop-filter: blur(10px);

            padding: 14px 20px;

            gap: 10px;

            backdrop-filter: blur(10px);

            letter-spacing: 1px;

            top: 3px;
            right: 3px;
            background: rgba(0, 0, 0, 0.75);
            color: #ef4444;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;

            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed var(--border);

            font-size: 1.5rem;

            transition: var(--transition);
            flex-shrink: 0;

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;

            flex: 1;

        .btn-edit { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--accent); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn:active { transform: scale(0.97); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    </style>
</head>

            { category: "Кондиционер", name: "Замена радиатора кондиционера (труд)", cost: 60 },
            { category: "Рулевое", name: "Замена рулевой тяги / наконечника", cost: 20 },
            { category: "Рулевое", name: "Замена рулевой рейки (труд)", cost: 80 },
            { category: "Рулевое", name: "Замена насоса ГУР", cost: 45 },
            { category: "Рулевое", name: "Замена жидкости ГУР", cost: 20 },
            { category: "Выхлоп", name: "Замена глушителя (труд)", cost: 30 },
            { category: "Выхлоп", name: "Замена катализатора (труд)", cost: 50 },
            { category: "Выхлоп", name: "Сварка выхлопной системы", cost: 20 },
            { category: "Детейлинг", name: "Мойка кузова (комплекс)", cost: 15 },
            { category: "Детейлинг", name: "Химчистка салона (базовая)", cost: 50 },
            { category: "Детейлинг", name: "Химчистка салона (глубокая)", cost: 90 },
            { category: "Детейлинг", name: "Полировка кузова (1 этап)", cost: 150 },
            { category: "Детейлинг", name: "Полировка кузова (3 этапа)", cost: 300 },
            { category: "Детейлинг", name: "Керамическое покрытие кузова", cost: 180 },
            { category: "Детейлинг", name: "Мойка двигателя (паром)", cost: 40 }
        ];

        // Status options
        const STATUS_OPTIONS = [
            { value: 'in_progress', label: '🟢 В работе' },
            { value: 'waiting_parts', label: '🟡 Ожидает запчасти' },
            { value: 'ready', label: '🔵 Готов к выдаче' },
            { value: 'completed', label: '⚪ Выдан клиенту' },
            { value: 'paused', label: '🔴 Приостановлен' }
        ];

        // ============================================
        // UTILS
        // ============================================
        const getEl = (id) => document.getElementById(id);

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }

        function getTodayISO() {
            return new Date().toISOString().split('T')[0];
        }

        // Group catalog for optgroup rendering
        function getGroupedCatalog() {
            return WORKS_CATALOG.reduce((acc, cat) => {
                if (!acc[cat.category]) acc[cat.category] = [];
                acc[cat.category].push(cat);
                return acc;
            }, {});
        }

        // ============================================
        // DATA FETCHING
        // ============================================
        async function fetchRecords() {
            const { data, error } = await client
                .from('speedline_records')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки:', error);
                updateSyncStatus('error');
                return;
            }

            workRecords = data || [];
            updateSyncStatus('ok');
            renderCardsList();
        }

        function updateSyncStatus(status) {
            const el = getEl('syncStatus');
            if (status === 'error') {
                el.textContent = '🔴 Офлайн';
                el.className = 'sync-badge error';
            } else if (status === 'saving') {
                el.textContent = '🟡 Сохранение...';
                el.className = 'sync-badge';
            } else {
                el.textContent = '🟢 Онлайн';
                el.className = 'sync-badge';
            }
        }

        // ============================================
        // ADD NEW RECORD
        // ============================================
        async function addRecord() {
            const today = getTodayISO();
            const newRecord = {
                date: today,
                car_brand: '',
                vin: '',
                plate_number: '',
                work_description: '[]',
                work_cost: 0,
                materials: '',
                material_cost: 0,
                notes: '',
                photos: [],
                client_name: '',
                status: 'in_progress',
                date_completed: null,
                archived: false
            };

            const { data, error } = await client
                .from('speedline_records')
                .insert([newRecord])
                .select();

            if (error) {
                alert('Ошибка добавления: ' + error.message);
                console.error('Supabase Insert Error:', error);
                return;
            }

            if (data && data.length > 0) {
                workRecords.unshift(data[0]);
                renderCardsList();
                setTimeout(() => toggleCardExpansion(data[0].id), 100);
            }
        }

        // ============================================
        // DELETE RECORD
        // ============================================
        async function deleteRecord(id) {
            if (!confirm('Удалить эту запись из общей базы?')) return;

            const { error } = await client
                .from('speedline_records')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Ошибка удаления: ' + error.message);
                return;
            }

            workRecords = workRecords.filter(r => r.id !== id);
            expandedCardId = null;
            editingCardId = null;
            renderCardsList();
        }

        // ============================================
        // UPDATE FIELD (autosave)
        // ============================================
        async function updateField(id, field, value) {
            const record = workRecords.find(r => r.id === id);
            if (!record) return;

            if (field === 'work_cost' || field === 'material_cost') {
                record[field] = parseFloat(value) || 0;
            } else {
                record[field] = value;
            }

            if (field === 'status' && value === 'completed' && !record.date_completed) {
                record.date_completed = getTodayISO();
                if (expandedCardId === id) {
                    const isEditing = editingCardId === id;
                    renderExpandedContent(id, isEditing);
                }
            }

            updateSyncStatus('saving');
            clearTimeout(saveTimeouts[id]);

            saveTimeouts[id] = setTimeout(async () => {
                const updateData = { [field]: record[field] };
                if (field === 'status' && value === 'completed' && record.date_completed) {
                    updateData.date_completed = record.date_completed;
                }

                const { error } = await client
                    .from('speedline_records')
                    .update(updateData)
                    .eq('id', id);

                if (error) {
                    console.error('Ошибка сохранения:', error);
                    updateSyncStatus('error');
                } else {
                    updateSyncStatus('ok');
                }
                if (field === 'status' || field === 'client_name' || field === 'car_brand' || field === 'plate_number' || field === 'date') {
                    renderCardsList();
                }
            }, 500);
        }

        // ============================================
        // PHOTOS
        // ============================================
        function triggerPhotoUpload(id) {
            const input = document.getElementById(`fileInput_${id}`);
            if (input) input.click();
        }

        async function uploadPhotos(id, inputElement) {
            const files = inputElement.files;
            if (!files || files.length === 0) return;

            updateSyncStatus('saving');
            const record = workRecords.find(r => r.id === id);
            if (!record) return;

            let photos = Array.isArray(record.photos) ? [...record.photos] : [];

            for (let file of files) {
                const fileExt = file.name.split('.').pop() || 'jpg';
                const fileName = `repair_${id}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

                const { error: uploadError } = await client.storage
                    .from('Logo')
                    .upload(fileName, file, { upsert: true });

                if (uploadError) {
                    console.error('Ошибка загрузки файла:', uploadError);
                    alert('Ошибка загрузки файла: ' + uploadError.message);
                    continue;
                }

                const { data: publicUrlData } = client.storage
                    .from('Logo')
                    .getPublicUrl(fileName);

                if (publicUrlData && publicUrlData.publicUrl) {
                    photos.push(publicUrlData.publicUrl);
                }
            }

            const { error: updateError } = await client
                .from('speedline_records')
                .update({ photos: photos })
                .eq('id', id);

            if (updateError) {
                console.error('Ошибка сохранения фото:', updateError);
                alert('Ошибка сохранения в базу: ' + updateError.message);
                updateSyncStatus('error');
            } else {
                record.photos = photos;
                updateSyncStatus('ok');
                if (expandedCardId === id) {
                    const isEditing = editingCardId === id;
                    renderExpandedContent(id, isEditing);
                }
            }
            inputElement.value = '';
        }

        async function deletePhoto(id, photoIndex) {
            if (!confirm('Удалить эту фотографию?')) return;
            const record = workRecords.find(r => r.id === id);
            if (!record || !Array.isArray(record.photos)) return;

            const photos = [...record.photos];
            photos.splice(photoIndex, 1);

            const { error } = await client
                .from('speedline_records')
                .update({ photos: photos })
                .eq('id', id);

            if (error) {
                alert('Ошибка удаления фото: ' + error.message);
                return;
            }
            record.photos = photos;
            if (expandedCardId === id) {
                const isEditing = editingCardId === id;
                renderExpandedContent(id, isEditing);
            }
        }

        // ============================================
        // WORK ITEMS MANAGEMENT
        // ============================================
        function parseWorkDescription(desc) {
            if (!desc) return [];
            try {
                const parsed = JSON.parse(desc);
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function serializeWorkDescription(items) {
            return JSON.stringify(items);
        }

        // ============================================
        // RENDER: CARDS LIST
        // ============================================
        function renderCardsList() {
            const cardsList = getEl('cardsList');
            if (!cardsList) return;

            let filtered = workRecords;
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                filtered = workRecords.filter(r => {
                    return (
                        (r.car_brand || '').toLowerCase().includes(q) ||
                        (r.vin || '').toLowerCase().includes(q) ||
                        (r.plate_number || '').toLowerCase().includes(q) ||
                        (r.client_name || '').toLowerCase().includes(q) ||
                        (r.date || '').includes(q) ||
                        formatDate(r.date).includes(q)
                    );
                });
            }

            if (filtered.length === 0) {
                cardsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔧</div>
                        <p>${searchQuery ? 'Ничего не найдено' : 'Нет записей. Добавьте первое авто!'}</p>
                    </div>
                `;
                return;
            }

            const groupedCatalog = getGroupedCatalog();
            
            cardsList.innerHTML = filtered.map(rec => {
                const isExpanded = expandedCardId === rec.id;
                const statusInfo = STATUS_OPTIONS.find(s => s.value === rec.status) || STATUS_OPTIONS[0];
                
                return `
                    <div class="card-wrapper" id="cardWrapper_${rec.id}">
                        <div class="compact-card ${isExpanded ? 'expanded' : ''}" 
                             onclick="toggleCardExpansion(${rec.id})"
                             data-id="${rec.id}">
                            <span class="car-icon">🚗</span>
                            <div class="compact-info">
                                <div class="compact-primary">
                                    <span class="compact-car">${rec.car_brand || 'Без марки'}</span>
                                    ${rec.plate_number ? `<span class="compact-plate">${rec.plate_number}</span>` : ''}
                                </div>
                                <div class="compact-secondary">
                                    ${rec.client_name ? `<span class="compact-client">👤 ${rec.client_name}</span>` : ''}
                                    <span class="compact-date">📅 ${formatDate(rec.date)}</span>
                                </div>
                            </div>
                            <span class="status-badge status-${rec.status}">${statusInfo.label}</span>
                            <span class="expand-arrow">▼</span>
                        </div>
                        <div class="expanded-content" id="expandedContent_${rec.id}">
                            ${isExpanded ? renderExpandedContentHTML(rec, groupedCatalog) : ''}
                        </div>
                    </div>
                `;
            }).join('');

            if (expandedCardId && editingCardId === expandedCardId) {
                const content = getEl(`expandedContent_${expandedCardId}`);
                if (content && content.style.display !== 'none') {
                    const rec = workRecords.find(r => r.id === expandedCardId);
                    if (rec) {
                        content.innerHTML = renderExpandedContentHTML(rec, groupedCatalog, true);
                    }
                }
            }
        }

        // ============================================
        // RENDER: EXPANDED CARD CONTENT
        // ============================================
        function renderExpandedContentHTML(rec, groupedCatalog, isEditing = false) {
            if (!rec) return '';
            
            const isThisEditing = editingCardId === rec.id;
            const workItems = parseWorkDescription(rec.work_description);
            const photosList = Array.isArray(rec.photos) ? rec.photos : [];
            
            let displayData = { ...rec };
            if (isThisEditing && editStates[rec.id]) {
                displayData = { ...displayData, ...editStates[rec.id] };
                if (editStates[rec.id].work_description) {
                    const editWorkItems = parseWorkDescription(editStates[rec.id].work_description);
                    displayData._workItems = editWorkItems;
                    displayData._totalWorkCost = editWorkItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
                } else {
                    displayData._workItems = workItems;
                    displayData._totalWorkCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
                }
                displayData._totalMaterialCost = parseFloat(editStates[rec.id].material_cost) || 0;
            } else {
                displayData._workItems = workItems;
                displayData._totalWorkCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);
                displayData._totalMaterialCost = parseFloat(rec.material_cost) || 0;
            }
            displayData._grandTotal = displayData._totalWorkCost + displayData._totalMaterialCost;

            const disabled = isThisEditing ? '' : 'disabled';
            const statusOptions = STATUS_OPTIONS.map(s => 
                `<option value="${s.value}" ${displayData.status === s.value ? 'selected' : ''}>${s.label}</option>`
            ).join('');

            // Build optgroups for work select
            const optgroupsHTML = Object.entries(groupedCatalog).map(([category, items]) => `
                <optgroup label="${category}">
                    ${items.map(item => `
                        <option value="${item.name.replace(/"/g, '&quot;')}" data-cost="${item.cost}">
                            ${item.name} (${item.cost}€)
                        </option>
                    `).join('')}
                </optgroup>
            `).join('');

            let workItemsHTML = displayData._workItems.map((w, idx) => `
                <div class="work-item">
                    <select ${disabled} onchange="updateWorkItem(${rec.id}, ${idx}, 'name', this.value)">
                        ${optgroupsHTML.replace(
                            new RegExp(`value="${w.name.replace(/"/g, '&quot;')}"`),
                            `value="${w.name.replace(/"/g, '&quot;')}" selected`
                        )}
                    </select>
                    <input type="number" class="work-cost" value="${w.cost || 0}" ${disabled}
                           oninput="updateWorkItem(${rec.id}, ${idx}, 'cost', this.value)">
                    ${!disabled ? `<button class="remove-work-btn" onclick="removeWorkItem(${rec.id}, ${idx})" title="Удалить">✕</button>` : ''}
                </div>

            return `
                <div class="section-title">👤 Клиент и авто</div>
                <div class="field-group">
                    <div class="field">
                        <div class="field-label">ФИО клиента</div>
                        <input type="text" value="${(displayData.client_name || '').replace(/"/g, '&quot;')}" ${disabled}
                               placeholder="Иванов Иван Иванович"
                               oninput="handleEditChange(${rec.id}, 'client_name', this.value)">
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <div class="field-label">🚗 Марка авто</div>
                            <input type="text" value="${(displayData.car_brand || '').replace(/"/g, '&quot;')}" ${disabled}
                                   placeholder="Марка"
                                   oninput="handleEditChange(${rec.id}, 'car_brand', this.value)">
                        </div>
                        <div class="field">
                            <div class="field-label">📅 Дата приёма</div>
                            <input type="date" value="${displayData.date || ''}" disabled>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <div class="field-label">🧬 VIN</div>
                            <input type="text" value="${(displayData.vin || '').replace(/"/g, '&quot;')}" ${disabled}
                                   placeholder="VIN" style="text-transform:uppercase;"
                                   oninput="handleEditChange(${rec.id}, 'vin', this.value)">
                        </div>
                        <div class="field">
                            <div class="field-label">🔢 Госномер</div>
                            <input type="text" value="${(displayData.plate_number || '').replace(/"/g, '&quot;')}" ${disabled}
                                   placeholder="Номер" style="text-transform:uppercase;"
                                   oninput="handleEditChange(${rec.id}, 'plate_number', this.value)">
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <div class="field-label">📌 Статус</div>
                            <select ${disabled} onchange="handleEditChange(${rec.id}, 'status', this.value); updateField(${rec.id}, 'status', this.value)">
                                ${statusOptions}
                            </select>
                        </div>
                        <div class="field">
                            <div class="field-label">📅 Дата завершения</div>
                            <input type="date" value="${displayData.date_completed || ''}" disabled>
                        </div>
                    </div>
                </div>

                <div class="section-title">🔧 Работы</div>
                <div class="field-group">
                    ${workItemsHTML || '<div style="color:var(--text-secondary); font-size:0.85rem; padding:8px;">Нет добавленных работ</div>'}
                    ${!disabled ? `
                        <button class="add-work-btn" onclick="addWorkItem(${rec.id})">➕ Добавить работу</button>
                    ` : ''}
                    <div class="field-row">
                        <div class="field">
                            <div class="field-label">💵 Итого работы (€)</div>
                            <input type="number" value="${displayData._totalWorkCost.toFixed(0)}" disabled>
                        </div>
                        <div class="field"></div>
                    </div>
                </div>

                <div class="section-title">🔩 Расходники</div>
                <div class="field-group">
                    <div class="field">
                        <div class="field-label">Описание расходников</div>
                        <textarea ${disabled} rows="2" placeholder="Список запчастей и материалов..."
                                  oninput="handleEditChange(${rec.id}, 'materials', this.value)">${displayData.materials || ''}</textarea>
                    </div>
                    <div class="field">
                        <div class="field-label">💰 Стоимость расходников (€)</div>
                        <input type="number" value="${displayData._totalMaterialCost || 0}" ${disabled}
                               oninput="handleEditChange(${rec.id}, 'material_cost', this.value)">
                    </div>
                </div>

                <div class="section-title">📸 Фотографии</div>
                <div class="photo-gallery">
                    ${photosList.map((url, pIdx) => `
                        <div class="photo-thumb-wrap">
                            <img src="${url}" class="photo-thumb" alt="Фото" 
                                 onclick="window.open('${url}', '_blank')" title="Открыть">

                    ${!disabled ? `
                        <div class="add-photo-btn" onclick="triggerPhotoUpload(${rec.id})" title="Добавить фото">＋</div>
                        <input type="file" id="fileInput_${rec.id}" class="hidden-file-input" 
                               accept="image/*" multiple onchange="uploadPhotos(${rec.id}, this)">
                    ` : ''}

                <div class="field-group">
                    <textarea ${disabled} rows="2" placeholder="Дополнительные заметки..."
                              oninput="handleEditChange(${rec.id}, 'notes', this.value)">${displayData.notes || ''}</textarea>

                <div style="display:flex; justify-content:space-between; align-items:center; 
                            background:rgba(239,68,68,0.15); padding:12px; border-radius:8px; 
                            font-weight:700; font-size:1rem;">

                    <span style="color:#ef4444;">${displayData._grandTotal.toFixed(0)} €</span>
                </div>

                <div class="action-buttons">
                    ${isThisEditing ? `
                        <button class="btn btn-save" onclick="saveRecord(${rec.id})">💾 Сохранить</button>
                        <button class="btn btn-edit" onclick="cancelEdit(${rec.id})">↩ Отменить</button>
                    ` : `
                        <button class="btn btn-edit" onclick="startEdit(${rec.id})">✏️ Редактировать</button>
                    `}
                    <button class="btn btn-delete" onclick="event.stopPropagation(); deleteRecord(${rec.id})">🗑️ Удалить</button>
                </div>
            `;
        }

        function renderExpandedContent(id, isEditing = false) {
            const content = getEl(`expandedContent_${id}`);
            if (!content) return;
            const rec = workRecords.find(r => r.id === id);
            if (!rec) return;
            const groupedCatalog = getGroupedCatalog();
            content.innerHTML = renderExpandedContentHTML(rec, groupedCatalog, isEditing);
        }

        // ============================================
        // CARD INTERACTIONS
        // ============================================
        function toggleCardExpansion(id) {
            if (expandedCardId === id) {
                expandedCardId = null;
                if (editingCardId === id) cancelEdit(id);
            } else {
                if (expandedCardId && editingCardId === expandedCardId) cancelEdit(expandedCardId);
                expandedCardId = id;
                const isEditing = editingCardId === id;
                renderExpandedContent(id, isEditing);
            }
            renderCardsList();
        }

        function startEdit(id) {
            editingCardId = id;
            expandedCardId = id;
            const rec = workRecords.find(r => r.id === id);
            if (rec) {
                editStates[id] = {
                    client_name: rec.client_name || '',
                    car_brand: rec.car_brand || '',
                    vin: rec.vin || '',
                    plate_number: rec.plate_number || '',
                    work_description: rec.work_description || '[]',
                    materials: rec.materials || '',
                    material_cost: rec.material_cost || 0,
                    notes: rec.notes || '',
                    status: rec.status || 'in_progress'
                };
            }
            renderCardsList();
        }

        function cancelEdit(id) {
            delete editStates[id];
            editingCardId = null;
            if (expandedCardId === id) renderExpandedContent(id, false);
            renderCardsList();
        }

        async function saveRecord(id) {
            const state = editStates[id];
            if (!state) return;
            updateSyncStatus('saving');

            const workItems = parseWorkDescription(state.work_description);
            const totalWorkCost = workItems.reduce((s, w) => s + (parseFloat(w.cost) || 0), 0);

            const updateData = {
                client_name: state.client_name,
                car_brand: state.car_brand,
                vin: state.vin,
                plate_number: state.plate_number,
                work_description: state.work_description,
                work_cost: totalWorkCost,
                materials: state.materials,
                material_cost: parseFloat(state.material_cost) || 0,
                notes: state.notes,
                status: state.status
            };

            if (state.status === 'completed') {
                const rec = workRecords.find(r => r.id === id);
                if (rec && !rec.date_completed) {
                    updateData.date_completed = getTodayISO();
                }
            }

            const { error } = await client
                .from('speedline_records')
                .update(updateData)
                .eq('id', id);

            if (error) {
                alert('Ошибка сохранения: ' + error.message);
                updateSyncStatus('error');
                return;
            }

            const rec = workRecords.find(r => r.id === id);
            if (rec) {
                Object.assign(rec, updateData);
                rec.work_cost = totalWorkCost;
            }

            delete editStates[id];
            editingCardId = null;
            updateSyncStatus('ok');
            renderCardsList();
            if (expandedCardId === id) renderExpandedContent(id, false);
        }

        function handleEditChange(id, field, value) {
            if (!editStates[id]) editStates[id] = {};
            editStates[id][field] = value;
            if (field === 'status') updateField(id, 'status', value);
        }

        // ============================================
        // WORK ITEM INTERACTIONS
        // ============================================
        function updateWorkItem(recordId, itemIndex, field, value) {
            if (!editStates[recordId]) return;
            const workItems = parseWorkDescription(editStates[recordId].work_description || '[]');
            if (workItems[itemIndex]) {
                if (field === 'cost') {
                    workItems[itemIndex].cost = parseFloat(value) || 0;
                } else if (field === 'name') {
                    const catalogItem = WORKS_CATALOG.find(c => c.name === value);
                    workItems[itemIndex].name = value;
                    if (catalogItem && catalogItem.cost > 0) {
                        workItems[itemIndex].cost = catalogItem.cost;
                    }
                }
                editStates[recordId].work_description = serializeWorkDescription(workItems);
                renderExpandedContent(recordId, true);
            }
        }

        function addWorkItem(recordId) {
            if (!editStates[recordId]) return;
            const workItems = parseWorkDescription(editStates[recordId].work_description || '[]');
            workItems.push({ name: WORKS_CATALOG[0].name, cost: WORKS_CATALOG[0].cost });
            editStates[recordId].work_description = serializeWorkDescription(workItems);
            renderExpandedContent(recordId, true);
        }

        function removeWorkItem(recordId, itemIndex) {
            if (!editStates[recordId]) return;
            const workItems = parseWorkDescription(editStates[recordId].work_description || '[]');
            workItems.splice(itemIndex, 1);
            editStates[recordId].work_description = serializeWorkDescription(workItems);
            renderExpandedContent(recordId, true);
        }

        // ============================================
        // SEARCH
        // ============================================
        let searchTimeout;
        getEl('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = this.value;
                expandedCardId = null;
                editingCardId = null;
                editStates = {};
                renderCardsList();
            }, 200);
        });

        // ============================================
        // EVENT LISTENERS
        // ============================================
        getEl('addBtn').addEventListener('click', addRecord);

        // ============================================
        // REALTIME SUBSCRIPTION
        // ============================================
        function initRealtime() {
            client
                .channel('public:speedline_records')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'speedline_records' }, 
                    () => fetchRecords()
                )
                .subscribe();
        }

        // ============================================
        // INIT
        // ============================================
        fetchRecords();
        initRealtime();
    </script>
</body>
</html>
