            { value: 'in_progress', label: '🟢 В работе' },
            { value: 'waiting_parts', label: '🟡 Ожидает запчасти' },
            { value: 'ready', label: '🔵 Готов к выдаче' },
            { value: 'completed', label: '⚪ Выдан клиенту' },
            { value: 'paused', label: '🔴 Приостановлен' }
        ];

        const getEl = (id) => document.getElementById(id);
        function formatDate(dateStr) { if (!dateStr) return ''; const p = dateStr.split('-'); return `${p[2]}.${p[1]}.${p[0]}`; }
        function getTodayISO() { return new Date().toISOString().split('T')[0]; }
        function getGroupedCatalog() { return WORKS_CATALOG.reduce((a,c)=>{ if(!a[c.category]) a[c.category]=[]; a[c.category].push(c); return a; },{}); }

        function parseVisits(json) { if(!json) return []; try { const p=JSON.parse(json); return Array.isArray(p)?p:[]; } catch { return []; } }
        function serializeVisits(arr) { return JSON.stringify(arr); }
        function parseWorkDescription(desc) { if(!desc) return []; try { const p=JSON.parse(desc); return Array.isArray(p)?p:[]; } catch { return []; } }
        function serializeWorkDescription(items) { return JSON.stringify(items); }

        async function fetchRecords() {
            const { data, error } = await client.from('speedline_records').select('*').order('id',{ascending:false});
            if(error){ console.error(error); updateSyncStatus('error'); return; }
            workRecords = data || [];
            updateSyncStatus('ok');
            renderCardsList();
        }

        function updateSyncStatus(s) {
            const el = getEl('syncStatus');
            if(s==='error'){ el.textContent='🔴 Офлайн'; el.className='sync-badge error'; }
            else if(s==='saving'){ el.textContent='🟡 Сохранение...'; el.className='sync-badge'; }
            else { el.textContent='🟢 Онлайн'; el.className='sync-badge'; }
        }

        async function addRecord() {
            const today = getTodayISO();
            const nr = { date:today, car_brand:'', vin:'', plate_number:'', work_description:'[]', work_cost:0, materials:'', material_cost:0, notes:'', photos:[], client_name:'', status:'in_progress', date_completed:null, archived:false, visits:'[]' };
            const { data, error } = await client.from('speedline_records').insert([nr]).select();
            if(error){ alert('Ошибка: '+error.message); return; }
            if(data && data.length>0){ workRecords.unshift(data[0]); renderCardsList(); setTimeout(()=>toggleCardExpansion(data[0].id),100); }
        }

        async function deleteRecord(id) {
            if(!confirm('Удалить запись и все визиты?')) return;
            await client.from('speedline_records').delete().eq('id',id);
            workRecords = workRecords.filter(r=>r.id!==id);
            expandedCardId=null; editingCardId=null; expandedVisitIds={}; renderCardsList();
        }

        async function updateField(id, field, value) {
            const rec = workRecords.find(r=>r.id===id); if(!rec) return;
            if(field==='work_cost'||field==='material_cost') rec[field]=parseFloat(value)||0; else rec[field]=value;
            if(field==='status'&&value==='completed'&&!rec.date_completed){ rec.date_completed=getTodayISO(); if(expandedCardId===id) renderExpandedContent(id); }
            updateSyncStatus('saving'); clearTimeout(saveTimeouts[id]);
            saveTimeouts[id]=setTimeout(async()=>{
                const upd={[field]:rec[field]};
                if(field==='status'&&value==='completed'&&rec.date_completed) upd.date_completed=rec.date_completed;
                const {error}=await client.from('speedline_records').update(upd).eq('id',id);
                if(error){ updateSyncStatus('error'); } else { updateSyncStatus('ok'); }
                if(field==='status'||field==='client_name'||field==='car_brand'||field==='plate_number'||field==='date') renderCardsList();
            },500);
        }

        async function updateVisitsField(id, visitsArr) {
            updateSyncStatus('saving'); clearTimeout(saveTimeouts['visits_'+id]);
            saveTimeouts['visits_'+id]=setTimeout(async()=>{
                const {error}=await client.from('speedline_records').update({visits:serializeVisits(visitsArr)}).eq('id',id);
                if(error){ updateSyncStatus('error'); } else { updateSyncStatus('ok'); }
            },500);
        }

        function triggerPhotoUpload(id){ const inp=getEl(`fileInput_${id}`); if(inp) inp.click(); }
        async function uploadPhotos(id, inputElement){
            const files=inputElement.files; if(!files||files.length===0) return;
            updateSyncStatus('saving'); const rec=workRecords.find(r=>r.id===id); if(!rec) return;
            let photos=Array.isArray(rec.photos)?[...rec.photos]:[];
            for(let file of files){
                const ext=file.name.split('.').pop()||'jpg';
                const fn=`repair_${id}_${Date.now()}_${Math.random().toString(36).substring(2,7)}.${ext}`;
                const {error:uploadError}=await client.storage.from('Logo').upload(fn,file,{upsert:true});
                if(uploadError){ console.error(uploadError); continue; }
                const {data:urlData}=client.storage.from('Logo').getPublicUrl(fn);
                if(urlData&&urlData.publicUrl) photos.push(urlData.publicUrl);
            }
            const {error:updateError}=await client.from('speedline_records').update({photos}).eq('id',id);
            if(updateError){ updateSyncStatus('error'); } else { rec.photos=photos; updateSyncStatus('ok'); if(expandedCardId===id) renderExpandedContent(id); }
            inputElement.value='';
        }

        async function deletePhoto(id, photoIndex){
            if(!confirm('Удалить фото?')) return;
            const rec=workRecords.find(r=>r.id===id); if(!rec||!Array.isArray(rec.photos)) return;
            const photos=[...rec.photos]; photos.splice(photoIndex,1);
            const {error}=await client.from('speedline_records').update({photos}).eq('id',id);
            if(error){ alert('Ошибка: '+error.message); return; }
            rec.photos=photos; if(expandedCardId===id) renderExpandedContent(id);
        }

        function getVisitsArr(rec){ return parseVisits(rec.visits); }

        function addVisit(recordId){
            const rec=workRecords.find(r=>r.id===recordId); if(!rec) return;
            const visits=getVisitsArr(rec);
            const today=getTodayISO();
            visits.push({ visit_date:today, mileage:'', work_description:'[]', work_cost:0, materials:'', material_cost:0, notes:'', status:'in_progress', date_completed:null });
            rec.visits=serializeVisits(visits);
            updateVisitsField(recordId, visits);
            const newIdx=visits.length-1;
            const visitId=`${recordId}_${newIdx}`;
            expandedVisitIds[visitId]=true;
            renderExpandedContent(recordId);
        }

        function deleteVisit(recordId, visitIndex){
            if(!confirm('Удалить этот визит?')) return;
            const rec=workRecords.find(r=>r.id===recordId); if(!rec) return;
            const visits=getVisitsArr(rec);
            const visitId=`${recordId}_${visitIndex}`;
            visits.splice(visitIndex,1);
            rec.visits=serializeVisits(visits);
            updateVisitsField(recordId, visits);
            delete expandedVisitIds[visitId];
            delete visitEditStates[visitId];
            if(editingVisitId===visitId) editingVisitId=null;
            renderExpandedContent(recordId);
        }

        function toggleVisitExpansion(recordId, visitIndex){
            const visitId=`${recordId}_${visitIndex}`;
            expandedVisitIds[visitId]=!expandedVisitIds[visitId];
            renderExpandedContent(recordId);
        }

        function startEditVisit(recordId, visitIndex){
            const visitId=`${recordId}_${visitIndex}`;
            editingVisitId=visitId;
            const rec=workRecords.find(r=>r.id===recordId); if(!rec) return;
            const visits=getVisitsArr(rec); const v=visits[visitIndex]; if(!v) return;
            visitEditStates[visitId]={ visit_date:v.visit_date||'', mileage:v.mileage||'', work_description:v.work_description||'[]', materials:v.materials||'', material_cost:v.material_cost||0, notes:v.notes||'', status:v.status||'in_progress' };
            renderExpandedContent(recordId);
        }

        function cancelEditVisit(recordId, visitIndex){
            const visitId=`${recordId}_${visitIndex}`;
            delete visitEditStates[visitId];
            editingVisitId=null;
            renderExpandedContent(recordId);
        }

        function saveVisit(recordId, visitIndex){
            const visitId=`${recordId}_${visitIndex}`;
            const state=visitEditStates[visitId]; if(!state) return;
            const rec=workRecords.find(r=>r.id===recordId); if(!rec) return;
            const visits=getVisitsArr(rec);
            const workItems=parseWorkDescription(state.work_description);
            const totalWorkCost=workItems.reduce((s,w)=>s+(parseFloat(w.cost)||0),0);
            const updatedVisit={...visits[visitIndex], ...state, work_cost:totalWorkCost, material_cost:parseFloat(state.material_cost)||0, mileage:parseInt(state.mileage)||null};
            if(state.status==='completed'&&!updatedVisit.date_completed) updatedVisit.date_completed=getTodayISO();
            visits[visitIndex]=updatedVisit;
            rec.visits=serializeVisits(visits);
            updateVisitsField(recordId, visits);
            delete visitEditStates[visitId];
            editingVisitId=null;
            renderExpandedContent(recordId);
        }

        function handleVisitEditChange(recordId, visitIndex, field, value){
            const visitId=`${recordId}_${visitIndex}`;
            if(!visitEditStates[visitId]) visitEditStates[visitId]={};
            visitEditStates[visitId][field]=value;
        }

        function updateVisitWorkItem(recordId, visitIndex, itemIndex, field, value){
            const visitId=`${recordId}_${visitIndex}`;
            if(!visitEditStates[visitId]) return;
            const workItems=parseWorkDescription(visitEditStates[visitId].work_description||'[]');
            if(workItems[itemIndex]){
                if(field==='cost') workItems[itemIndex].cost=parseFloat(value)||0;
                else if(field==='name'){ const ci=WORKS_CATALOG.find(c=>c.name===value); workItems[itemIndex].name=value; if(ci&&ci.cost>0) workItems[itemIndex].cost=ci.cost; }
                visitEditStates[visitId].work_description=serializeWorkDescription(workItems);
                renderExpandedContent(recordId);
            }
        }

        function addVisitWorkItem(recordId, visitIndex){
            const visitId=`${recordId}_${visitIndex}`;
            if(!visitEditStates[visitId]) return;
            const workItems=parseWorkDescription(visitEditStates[visitId].work_description||'[]');
            workItems.push({name:WORKS_CATALOG[0].name, cost:WORKS_CATALOG[0].cost});
            visitEditStates[visitId].work_description=serializeWorkDescription(workItems);
            renderExpandedContent(recordId);
        }

        function removeVisitWorkItem(recordId, visitIndex, itemIndex){
            const visitId=`${recordId}_${visitIndex}`;
            if(!visitEditStates[visitId]) return;
            const workItems=parseWorkDescription(visitEditStates[visitId].work_description||'[]');
            workItems.splice(itemIndex,1);
            visitEditStates[visitId].work_description=serializeWorkDescription(workItems);
            renderExpandedContent(recordId);
        }

        function renderCardsList(){
            const cardsList=getEl('cardsList'); if(!cardsList) return;
            let filtered=workRecords;
            if(searchQuery.trim()){
                const q=searchQuery.toLowerCase().trim();
                filtered=workRecords.filter(r=>(r.car_brand||'').toLowerCase().includes(q)||(r.vin||'').toLowerCase().includes(q)||(r.plate_number||'').toLowerCase().includes(q)||(r.client_name||'').toLowerCase().includes(q)||(r.date||'').includes(q)||formatDate(r.date).includes(q));
            }
            if(filtered.length===0){ cardsList.innerHTML=`<div class="empty-state"><div class="empty-state-icon">🔧</div><p>${searchQuery?'Ничего не найдено':'Нет записей'}</p></div>`; return; }
            cardsList.innerHTML=filtered.map(rec=>{
                const isExpanded=expandedCardId===rec.id;
                const statusInfo=STATUS_OPTIONS.find(s=>s.value===rec.status)||STATUS_OPTIONS[0];
                const visits=getVisitsArr(rec);
                return `<div class="card-wrapper" id="cardWrapper_${rec.id}">
                    <div class="compact-card ${isExpanded?'expanded':''}" onclick="toggleCardExpansion(${rec.id})" data-id="${rec.id}">
                        <span class="car-icon">🚗</span>
                        <div class="compact-info">
                            <div class="compact-primary"><span class="compact-car">${rec.car_brand||'Без марки'}</span>${rec.plate_number?`<span class="compact-plate">${rec.plate_number}</span>`:''}</div>
                            <div class="compact-secondary">${rec.client_name?`<span class="compact-client">👤 ${rec.client_name}</span>`:''}<span class="compact-date">📅 ${formatDate(rec.date)}</span>${visits.length>0?`<span class="compact-visits">🔄 ${visits.length} визит(ов)</span>`:''}</div>
                        </div>
                        <span class="status-badge status-${rec.status}">${statusInfo.label}</span>
                        <span class="expand-arrow">▼</span>
                    </div>
                    <div class="expanded-content" id="expandedContent_${rec.id}">${isExpanded?renderExpandedContentHTML(rec):''}</div>
                </div>`;
            }).join('');
            if(expandedCardId){ const rec=workRecords.find(r=>r.id===expandedCardId); if(rec) renderExpandedContent(expandedCardId); }
        }

        function renderExpandedContentHTML(rec){
            if(!rec) return '';
            const isEditing=editingCardId===rec.id;
            const visits=getVisitsArr(rec);
            const groupedCatalog=getGroupedCatalog();
            let displayData={...rec};
            let workItems, totalWorkCost, totalMaterialCost;
            if(isEditing&&editStates[rec.id]){ displayData={...displayData,...editStates[rec.id]}; workItems=parseWorkDescription(editStates[rec.id].work_description||rec.work_description); totalWorkCost=workItems.reduce((s,w)=>s+(parseFloat(w.cost)||0),0); totalMaterialCost=parseFloat(editStates[rec.id].material_cost)||0; }
            else { workItems=parseWorkDescription(rec.work_description); totalWorkCost=workItems.reduce((s,w)=>s+(parseFloat(w.cost)||0),0); totalMaterialCost=parseFloat(rec.material_cost)||0; }
            const grandTotal=totalWorkCost+totalMaterialCost;
            const disabled=isEditing?'':'disabled';
            const statusOptions=STATUS_OPTIONS.map(s=>`<option value="${s.value}" ${displayData.status===s.value?'selected':''}>${s.label}</option>`).join('');
            const optgroupsHTML=Object.entries(groupedCatalog).map(([cat,items])=>`<optgroup label="${cat}">${items.map(item=>`<option value="${item.name.replace(/"/g,'&quot;')}" data-cost="${item.cost}">${item.name} (${item.cost}€)</option>`).join('')}</optgroup>`).join('');

            let workItemsHTML=workItems.map((w,idx)=>`<div class="work-item"><select ${disabled} onchange="updateWorkItem(${rec.id},${idx},'name',this.value)">${optgroupsHTML.replace(new RegExp(`value="${(w.name||'').replace(/"/g,'&quot;')}"`),`value="${(w.name||'').replace(/"/g,'&quot;')}" selected`)}</select><input type="number" class="work-cost" value="${w.cost||0}" ${disabled} oninput="updateWorkItem(${rec.id},${idx},'cost',this.value)">${!disabled?`<button class="remove-work-btn" onclick="removeWorkItem(${rec.id},${idx})" title="Удалить">✕</button>`:''}</div>`).join('');

            const photosList=Array.isArray(rec.photos)?rec.photos:[];
            let visitsTotal=0;
            visits.forEach(v=>{ const wi=parseWorkDescription(v.work_description); visitsTotal+=wi.reduce((s,w)=>s+(parseFloat(w.cost)||0),0)+(parseFloat(v.material_cost)||0); });
            const allTimeTotal=grandTotal+visitsTotal;

            let visitsHTML=`<div class="section-title">📋 История обслуживания (${visits.length} визитов)</div><div class="field-group">`;
            visits.forEach((v,idx)=>{
                const visitId=`${rec.id}_${idx}`;
                const isVisitEditing=editingVisitId===visitId;
                const visitState=visitEditStates[visitId];
                const vDisplay=visitState?{...v,...visitState}:v;
                const vWorkItems=visitState?parseWorkDescription(visitState.work_description):parseWorkDescription(v.work_description);
                const vWorkCost=vWorkItems.reduce((s,w)=>s+(parseFloat(w.cost)||0),0);
                const vMaterialCost=parseFloat(vDisplay.material_cost)||0;
                const vGrandTotal=vWorkCost+vMaterialCost;
                const isOpen=expandedVisitIds[visitId];
                const vStatusInfo=STATUS_OPTIONS.find(s=>s.value===vDisplay.status)||STATUS_OPTIONS[0];

                let vWorkItemsHTML=vWorkItems.map((w,widx)=>`<div class="work-item"><select ${isVisitEditing?'':'disabled'} onchange="updateVisitWorkItem(${rec.id},${idx},${widx},'name',this.value)">${optgroupsHTML.replace(new RegExp(`value="${(w.name||'').replace(/"/g,'&quot;')}"`),`value="${(w.name||'').replace(/"/g,'&quot;')}" selected`)}</select><input type="number" class="work-cost" value="${w.cost||0}" ${isVisitEditing?'':'disabled'} oninput="updateVisitWorkItem(${rec.id},${idx},${widx},'cost',this.value)">${isVisitEditing?`<button class="remove-work-btn" onclick="removeVisitWorkItem(${rec.id},${idx},${widx})" title="Удалить">✕</button>`:''}</div>`).join('');

                visitsHTML+=`<div style="border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:8px;">
                    <div class="section-title visit-title ${isOpen?'expanded':''}" onclick="event.stopPropagation(); toggleVisitExpansion(${rec.id},${idx})">
                        <div class="visit-summary"><span>📅 ${formatDate(vDisplay.visit_date)}</span>${vDisplay.mileage?`<span>🔢 ${vDisplay.mileage} км</span>`:''}<span class="visit-status status-${vDisplay.status}">${vStatusInfo.label}</span><span style="color:var(--accent); font-weight:700;">${vGrandTotal.toFixed(0)} €</span></div>
                        <span class="visit-arrow">▼</span>
                    </div>
                    <div class="visit-content ${isOpen?'open':''}">${isVisitEditing?`
                        <div class="field-row"><div class="field"><div class="field-label">📅 Дата визита</div><input type="date" value="${vDisplay.visit_date||''}" oninput="handleVisitEditChange(${rec.id},${idx},'visit_date',this.value)"></div><div class="field"><div class="field-label">🔢 Пробег (км)</div><input type="number" value="${vDisplay.mileage||''}" oninput="handleVisitEditChange(${rec.id},${idx},'mileage',this.value)"></div></div>
                        <div class="field"><div class="field-label">📌 Статус</div><select onchange="handleVisitEditChange(${rec.id},${idx},'status',this.value)">${statusOptions.replace(new RegExp(`value="${vDisplay.status}"`),`value="${vDisplay.status}" selected`)}</select></div>
                        <div class="field-label" style="margin-top:8px;">🔧 Работы</div>${vWorkItemsHTML||'<div style="color:var(--text-secondary); font-size:0.8rem;">Нет работ</div>'}
                        <button class="add-work-btn" onclick="addVisitWorkItem(${rec.id},${idx})">➕ Добавить работу</button>
                        <div class="field-row" style="margin-top:8px;"><div class="field"><div class="field-label">💵 Итого работы (€)</div><input type="number" value="${vWorkCost.toFixed(0)}" disabled></div><div class="field"></div></div>
                        <div class="field-label" style="margin-top:8px;">🔩 Расходники</div><textarea rows="2" placeholder="Описание..." oninput="handleVisitEditChange(${rec.id},${idx},'materials',this.value)">${vDisplay.materials||''}</textarea>
                        <div class="field"><div class="field-label">💰 Стоимость расходников (€)</div><input type="number" value="${vMaterialCost||0}" oninput="handleVisitEditChange(${rec.id},${idx},'material_cost',this.value)"></div>
                        <div class="field-label" style="margin-top:8px;">📝 Заметки</div><textarea rows="2" placeholder="Заметки..." oninput="handleVisitEditChange(${rec.id},${idx},'notes',this.value)">${vDisplay.notes||''}</textarea>
                        <div style="display:flex; gap:8px; margin-top:12px;"><button class="btn btn-save" onclick="event.stopPropagation(); saveVisit(${rec.id},${idx})">💾 Сохранить</button><button class="btn btn-edit" onclick="event.stopPropagation(); cancelEditVisit(${rec.id},${idx})">↩ Отменить</button><button class="btn btn-delete-visit" onclick="event.stopPropagation(); deleteVisit(${rec.id},${idx})">🗑️ Удалить</button></div>
                    `:`
                        <div class="field-row"><div class="field"><div class="field-label">📅 Дата</div><input value="${formatDate(v.visit_date)}" disabled></div><div class="field"><div class="field-label">🔢 Пробег</div><input value="${v.mileage?v.mileage+' км':'—'}" disabled></div></div>
                        <div class="field"><div class="field-label">📌 Статус</div><input value="${vStatusInfo.label}" disabled></div>
                        ${vWorkItems.length>0?`<div class="field-label" style="margin-top:8px;">🔧 Работы</div>${vWorkItems.map(w=>`<div style="display:flex; justify-content:space-between; font-size:0.85rem; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span>${w.name}</span><span style="color:var(--text-secondary);">${parseFloat(w.cost).toFixed(0)} €</span></div>`).join('')}<div style="font-weight:700; text-align:right; margin-top:4px;">💵 ${vWorkCost.toFixed(0)} €</div>`:'<div style="color:var(--text-secondary); font-size:0.8rem;">Нет работ</div>'}
                        ${vDisplay.materials?`<div class="field-label" style="margin-top:8px;">🔩 Расходники</div><div style="font-size:0.85rem;">${vDisplay.materials}</div>`:''}
                        ${vMaterialCost>0?`<div style="text-align:right; font-weight:700;">💰 ${vMaterialCost.toFixed(0)} €</div>`:''}
                        ${vDisplay.notes?`<div class="field-label" style="margin-top:8px;">📝 Заметки</div><div style="font-size:0.85rem;">${vDisplay.notes}</div>`:''}
                        <div style="display:flex; gap:8px; margin-top:12px;"><button class="btn btn-edit" onclick="event.stopPropagation(); startEditVisit(${rec.id},${idx})">✏️ Редактировать</button><button class="btn btn-delete-visit" onclick="event.stopPropagation(); deleteVisit(${rec.id},${idx})">🗑️ Удалить</button></div>
                    `}</div>
                </div>`;
            });
            visitsHTML+=`<button class="add-visit-btn" onclick="event.stopPropagation(); addVisit(${rec.id})">➕ Новый визит</button></div>`;

            return `
                <div class="section-title">👤 Клиент и авто</div>
                <div class="field-group">
                    <div class="field"><div class="field-label">ФИО клиента</div><input type="text" value="${(displayData.client_name||'').replace(/"/g,'&quot;')}" ${disabled} placeholder="Иванов Иван Иванович" oninput="handleEditChange(${rec.id},'client_name',this.value)"></div>
                    <div class="field-row"><div class="field"><div class="field-label">🚗 Марка авто</div><input type="text" value="${(displayData.car_brand||'').replace(/"/g,'&quot;')}" ${disabled} placeholder="Марка" oninput="handleEditChange(${rec.id},'car_brand',this.value)"></div><div class="field"><div class="field-label">📅 Дата приёма</div><input type="date" value="${displayData.date||''}" disabled></div></div>
                    <div class="field-row"><div class="field"><div class="field-label">🧬 VIN</div><input type="text" value="${(displayData.vin||'').replace(/"/g,'&quot;')}" ${disabled} placeholder="VIN" style="text-transform:uppercase;" oninput="handleEditChange(${rec.id},'vin',this.value)"></div><div class="field"><div class="field-label">🔢 Госномер</div><input type="text" value="${(displayData.plate_number||'').replace(/"/g,'&quot;')}" ${disabled} placeholder="Номер" style="text-transform:uppercase;" oninput="handleEditChange(${rec.id},'plate_number',this.value)"></div></div>
                    <div class="field-row"><div class="field"><div class="field-label">📌 Статус</div><select ${disabled} onchange="handleEditChange(${rec.id},'status',this.value); updateField(${rec.id},'status',this.value)">${statusOptions}</select></div><div class="field"><div class="field-label">📅 Дата завершения</div><input type="date" value="${displayData.date_completed||''}" disabled></div></div>
                </div>

                <div class="section-title">🔧 Работы (текущий визит)</div>
                <div class="field-group">
                    ${workItemsHTML||'<div style="color:var(--text-secondary); font-size:0.85rem; padding:8px;">Нет добавленных работ</div>'}
                    ${!disabled?`<button class="add-work-btn" onclick="addWorkItem(${rec.id})">➕ Добавить работу</button>`:''}
                    <div class="field-row"><div class="field"><div class="field-label">💵 Итого работы (€)</div><input type="number" value="${totalWorkCost.toFixed(0)}" disabled></div><div class="field"></div></div>
                </div>

                <div class="section-title">🔩 Расходники (текущий визит)</div>
                <div class="field-group">
                    <div class="field"><div class="field-label">Описание расходников</div><textarea ${disabled} rows="2" placeholder="Список запчастей и материалов..." oninput="handleEditChange(${rec.id},'materials',this.value)">${displayData.materials||''}</textarea></div>
                    <div class="field"><div class="field-label">💰 Стоимость расходников (€)</div><input type="number" value="${totalMaterialCost||0}" ${disabled} oninput="handleEditChange(${rec.id},'material_cost',this.value)"></div>
                </div>

                ${visitsHTML}

                <div class="section-title">📸 Фотографии</div>
                <div class="photo-gallery">
                    ${photosList.map((url,pIdx)=>`<div class="photo-thumb-wrap"><img src="${url}" class="photo-thumb" alt="Фото" onclick="window.open('${url}','_blank')" title="Открыть">${!disabled?`<button class="photo-delete-btn" onclick="event.stopPropagation(); deletePhoto(${rec.id},${pIdx})" title="Удалить">✕</button>`:''}</div>`).join('')}
                    ${!disabled?`<div class="add-photo-btn" onclick="triggerPhotoUpload(${rec.id})" title="Добавить фото">＋</div><input type="file" id="fileInput_${rec.id}" class="hidden-file-input" accept="image/*" multiple onchange="uploadPhotos(${rec.id},this)">`:''}
                </div>

                <div class="section-title">📝 Заметки</div>
                <div class="field-group"><textarea ${disabled} rows="2" placeholder="Дополнительные заметки..." oninput="handleEditChange(${rec.id},'notes',this.value)">${displayData.notes||''}</textarea></div>

                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(239,68,68,0.15); padding:12px; border-radius:8px; font-weight:700; font-size:1rem;">
                    <span>💰 Итого по машине (все визиты):</span>
                    <span style="color:#ef4444;">${allTimeTotal.toFixed(0)} €</span>
                </div>

                <div class="action-buttons">
                    ${isEditing?`<button class="btn btn-save" onclick="saveRecord(${rec.id})">💾 Сохранить</button><button class="btn btn-edit" onclick="cancelEdit(${rec.id})">↩ Отменить</button>`:`<button class="btn btn-edit" onclick="startEdit(${rec.id})">✏️ Редактировать</button>`}
                    <button class="btn btn-delete" onclick="event.stopPropagation(); deleteRecord(${rec.id})">🗑️ Удалить</button>
                </div>`;
        }

        function renderExpandedContent(id){ const content=getEl(`expandedContent_${id}`); if(!content) return; const rec=workRecords.find(r=>r.id===id); if(!rec) return; content.innerHTML=renderExpandedContentHTML(rec); }

        function toggleCardExpansion(id){
            if(expandedCardId===id){ expandedCardId=null; if(editingCardId===id) cancelEdit(id); }
            else { if(expandedCardId&&editingCardId===expandedCardId) cancelEdit(expandedCardId); expandedCardId=id; }
            renderCardsList();
        }

        function startEdit(id){ editingCardId=id; expandedCardId=id; const rec=workRecords.find(r=>r.id===id); if(rec) editStates[id]={ client_name:rec.client_name||'', car_brand:rec.car_brand||'', vin:rec.vin||'', plate_number:rec.plate_number||'', work_description:rec.work_description||'[]', materials:rec.materials||'', material_cost:rec.material_cost||0, notes:rec.notes||'', status:rec.status||'in_progress' }; renderCardsList(); }
        function cancelEdit(id){ delete editStates[id]; editingCardId=null; if(expandedCardId===id) renderExpandedContent(id); renderCardsList(); }

        async function saveRecord(id){
            const state=editStates[id]; if(!state) return; updateSyncStatus('saving');
            const workItems=parseWorkDescription(state.work_description); const totalWorkCost=workItems.reduce((s,w)=>s+(parseFloat(w.cost)||0),0);
            const upd={ client_name:state.client_name, car_brand:state.car_brand, vin:state.vin, plate_number:state.plate_number, work_description:state.work_description, work_cost:totalWorkCost, materials:state.materials, material_cost:parseFloat(state.material_cost)||0, notes:state.notes, status:state.status };
            if(state.status==='completed'){ const rec=workRecords.find(r=>r.id===id); if(rec&&!rec.date_completed) upd.date_completed=getTodayISO(); }
            const {error}=await client.from('speedline_records').update(upd).eq('id',id);
            if(error){ alert('Ошибка: '+error.message); updateSyncStatus('error'); return; }
            const rec=workRecords.find(r=>r.id===id); if(rec) Object.assign(rec,upd);
            delete editStates[id]; editingCardId=null; updateSyncStatus('ok'); renderCardsList(); if(expandedCardId===id) renderExpandedContent(id);
        }

        function handleEditChange(id,field,value){ if(!editStates[id]) editStates[id]={}; editStates[id][field]=value; if(field==='status') updateField(id,'status',value); }

        function updateWorkItem(recordId,itemIndex,field,value){
            if(!editStates[recordId]) return;
            const workItems=parseWorkDescription(editStates[recordId].work_description||'[]');
            if(workItems[itemIndex]){ if(field==='cost') workItems[itemIndex].cost=parseFloat(value)||0; else if(field==='name'){ const ci=WORKS_CATALOG.find(c=>c.name===value); workItems[itemIndex].name=value; if(ci&&ci.cost>0) workItems[itemIndex].cost=ci.cost; } editStates[recordId].work_description=serializeWorkDescription(workItems); renderExpandedContent(recordId); }
        }
        function addWorkItem(recordId){ if(!editStates[recordId]) return; const workItems=parseWorkDescription(editStates[recordId].work_description||'[]'); workItems.push({name:WORKS_CATALOG[0].name,cost:WORKS_CATALOG[0].cost}); editStates[recordId].work_description=serializeWorkDescription(workItems); renderExpandedContent(recordId); }
        function removeWorkItem(recordId,itemIndex){ if(!editStates[recordId]) return; const workItems=parseWorkDescription(editStates[recordId].work_description||'[]'); workItems.splice(itemIndex,1); editStates[recordId].work_description=serializeWorkDescription(workItems); renderExpandedContent(recordId); }

        let searchTimeout;
        getEl('searchInput').addEventListener('input',function(){ clearTimeout(searchTimeout); searchTimeout=setTimeout(()=>{ searchQuery=this.value; expandedCardId=null; editingCardId=null; editingVisitId=null; editStates={}; visitEditStates={}; expandedVisitIds={}; renderCardsList(); },200); });
        getEl('addBtn').addEventListener('click',addRecord);

        function initRealtime(){ client.channel('public:speedline_records').on('postgres_changes',{event:'*',schema:'public',table:'speedline_records'},()=>fetchRecords()).subscribe(); }

        fetchRecords();
        initRealtime();
    </script>
</body>
</html>
