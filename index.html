<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>SpeedLine Garage — Database</title>
    <!-- Мобильная консоль Eruda для отладки -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; padding: 10px; color: #e0e0e0; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(22, 33, 62, 0.85); backdrop-filter: blur(20px); border-radius: 16px; padding: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); }
        .header-section { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4); flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.2); }
        .company-name { font-size: 1.1rem; font-weight: 700; color: #ffffff; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.2; }
        .company-subtitle { font-size: 0.7rem; color: #a0a0a0; letter-spacing: 0.5px; text-transform: uppercase; }
        .sync-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: rgba(0, 255, 100, 0.15); color: #00ff64; border: 1px solid rgba(0, 255, 100, 0.3); }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
        .stat-card { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: #a0a0a0; margin-bottom: 4px; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: #ff6b6b; }
        .controls { display: flex; gap: 10px; margin-bottom: 16px; }
        .add-btn { background: linear-gradient(135deg, #e94560, #c23152); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        
        .cards-container { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
        .card { background: rgba(0, 0, 0, 0.4); border-radius: 14px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-number { font-weight: 700; color: #ff6b6b; background: rgba(233, 69, 96, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.9rem; }
        .card-field { margin-bottom: 10px; }
        .card-label { font-size: 0.7rem; text-transform: uppercase; color: #a0a0a0; margin-bottom: 4px; font-weight: 600; }
        .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .photo-gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; align-items: center; }
        .photo-thumb-wrap { position: relative; width: 70px; height: 70px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); flex-shrink: 0; }
        .photo-thumb { width: 100%; height: 100%; object-fit: cover; }
        .photo-delete-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: #ff4b4b; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .add-photo-btn { width: 70px; height: 70px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 2px dashed rgba(255,255,255,0.2); color: #a0a0a0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: border-color 0.2s; flex-shrink: 0; gap: 2px; }
        .add-photo-btn span { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.3px; }
        .add-photo-btn:hover { border-color: #e94560; color: #e94560; }

        .card-total { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); font-weight: 700; color: #ff6b6b; }
        
        input, textarea { width: 100%; padding: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; font-size: 0.9rem; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #e94560; box-shadow: 0 0 0 2px rgba(233, 69, 96, 0.2); }
        input[type="number"] { text-align: right; }
        textarea { resize: vertical; min-height: 45px; }
        
        .delete-btn { background: rgba(255, 75, 75, 0.2); color: #ff4b4b; border: 1px solid rgba(255, 75, 75, 0.3); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; width: 100%; margin-top: 10px; }
        
        .grand-total-card { background: rgba(233, 69, 96, 0.2); border-radius: 14px; padding: 16px; border: 1px solid rgba(233, 69, 96, 0.3); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 1rem; color: #ffffff; margin-bottom: 16px; }
        .grand-total-value { font-size: 1.2rem; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <div class="logo-area">
                <img src="https://qtkbqqnfuwzqytssxmah.supabase.co/storage/v1/object/public/Logo/IMG_20260729_174121.jpg" alt="SpeedLine Garage Logo" class="logo-img">
                <div>
                    <div class="company-name">SpeedLine Garage</div>
                    <div class="company-subtitle">database</div>
                </div>
            </div>
            <div id="syncStatus" class="sync-status">🟢 Подключение...</div>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-label">📌 Записей</div><div class="stat-value" id="totalRecords">0</div></div>
            <div class="stat-card"><div class="stat-label">💰 Работы</div><div class="stat-value" id="totalWorkCost">0 €</div></div>
            <div class="stat-card"><div class="stat-label">🔩 Расходники</div><div class="stat-value" id="totalMaterialCost">0 €</div></div>
            <div class="stat-card"><div class="stat-label">🧾 ИТОГО</div><div class="stat-value" id="totalSum">0 €</div></div>
        </div>

        <div class="controls">
            <button class="add-btn" id="addBtn">➕ Добавить запись</button>
        </div>

        <div class="cards-container" id="cardsContainer"></div>

        <div class="grand-total-card">
            <span>🧾 ИТОГО ПО ВСЕМ</span>
            <span class="grand-total-value" id="mobileGrandTotal">0 €</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qtkbqqnfuwzqytssxmah.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0a2JxcW5mdXd6cXl0c3N4bWFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjMwMDMsImV4cCI6MjEwMDg5OTAwM30.YSE_kDwabkvAnOrq4lP1pofJTAtwao36cZde0kiUmFM';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let workRecords = [];
        let saveTimeouts = {};
        let pendingRender = false;

        const getEl = (id) => document.getElementById(id);

        async function fetchRecords() {
            const { data, error } = await client
                .from('speedline_records')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error('Ошибка загрузки:', error);
                getEl('syncStatus').textContent = '🔴 Ошибка связи';
                getEl('syncStatus').style.background = 'rgba(255,0,0,0.15)';
                getEl('syncStatus').style.color = '#ff4b4b';
                return;
            }

            workRecords = data || [];
            renderAll();
            getEl('syncStatus').textContent = '🟢 Синхронизировано';
        }

        async function addRow() {
            const today = new Date().toISOString().split('T')[0];
            const newRecord = {
                date: today,
                car_brand: '',
                vin: '',
                plate_number: '',
                work_description: '',
                work_cost: 0,
                materials: '',
                material_cost: 0,
                notes: '',
                photo: []
            };

            const { data, error } = await client
                .from('speedline_records')
                .insert([newRecord])
                .select();

            if (error) {
                alert('Ошибка добавления: ' + error.message);
                console.error('Supabase Insert Error:', error);
                return;
            }

            if (data && data.length > 0) {
                workRecords.push(data[0]);
                renderAll();
            }
        }

        async function deleteRow(id) {
            if (!confirm('Удалить эту запись из общей базы?')) return;

            const { error } = await client
                .from('speedline_records')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Ошибка удаления: ' + error.message);
                return;
            }

            workRecords = workRecords.filter(r => r.id !== id);
            renderAll();
        }

        function updateField(id, field, value) {
            const record = workRecords.find(r => r.id === id);
            if (!record) return;

            record[field] = (field === 'work_cost' || field === 'material_cost') ? (parseFloat(value) || 0) : value;
            updateStatsOnly();
            updateCardTotalUI(id);

            clearTimeout(saveTimeouts[id]);
            saveTimeouts[id] = setTimeout(async () => {
                const { error } = await client
                    .from('speedline_records')
                    .update({ [field]: record[field] })
                    .eq('id', id);

                if (error) {
                    console.error('Ошибка сохранения:', error);
                    getEl('syncStatus').textContent = '🟡 Ошибка сохранения';
                } else {
                    getEl('syncStatus').textContent = '🟢 Синхронизировано';
                }
            }, 500);
        }

        function triggerCamera(id) {
            getEl(`cameraInput_${id}`).click();
        }

        function triggerGallery(id) {
            getEl(`fileInput_${id}`).click();
        }

        async function uploadPhotos(id, inputElement) {
            const files = inputElement.files;
            if (!files || files.length === 0) return;

            getEl('syncStatus').textContent = '⏳ Загрузка фото...';
            const record = workRecords.find(r => r.id === id);
            if (!record) return;

            if (!Array.isArray(record.photo)) {
                record.photo = record.photo ? [record.photo] : [];
            }

            for (let file of files) {
                const fileExt = file.name.split('.').pop() || 'jpg';
                const fileName = `repair_${id}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

                const { error: uploadError } = await client.storage
                    .from('Logo')
                    .upload(fileName, file, { upsert: true });

                if (uploadError) {
                    console.error('Ошибка загрузки файла в Storage:', uploadError);
                    alert('Ошибка загрузки файла: ' + uploadError.message);
                    continue;
                }

                const { data: publicUrlData } = client.storage
                    .from('Logo')
                    .getPublicUrl(fileName);

                if (publicUrlData && publicUrlData.publicUrl) {
                    record.photo.push(publicUrlData.publicUrl);
                }
            }

            const { error: updateError } = await client
                .from('speedline_records')
                .update({ photo: record.photo })
                .eq('id', id);

            if (updateError) {
                console.error('Ошибка сохранения массива фото в базу:', updateError);
                alert('Ошибка сохранения в базу: ' + updateError.message);
                getEl('syncStatus').textContent = '🟡 Ошибка сохранения фото';
            } else {
                getEl('syncStatus').textContent = '🟢 Синхронизировано';
            }

            inputElement.value = '';
            renderAll();
        }

        async function deletePhoto(id, photoIndex) {
            if (!confirm('Удалить эту фотографию?')) return;
            const record = workRecords.find(r => r.id === id);
            if (!record || !Array.isArray(record.photo)) return;

            record.photo.splice(photoIndex, 1);

            const { error } = await client
                .from('speedline_records')
                .update({ photo: record.photo })
                .eq('id', id);

            if (error) {
                alert('Ошибка удаления фото: ' + error.message);
                return;
            }

            renderAll();
        }

        function updateCardTotalUI(id) {
            const card = document.querySelector(`.card[data-id="${id}"]`);
            if (!card) return;
            const record = workRecords.find(r => r.id === id);
            if (!record) return;
            const total = (parseFloat(record.work_cost) || 0) + (parseFloat(record.material_cost) || 0);
            const totalSpan = card.querySelector('.card-total-val');
            if (totalSpan) totalSpan.textContent = total.toFixed(0) + ' €';
        }

        function updateStatsOnly() {
            const totalCount = workRecords.length;
            getEl('totalRecords').textContent = totalCount;
            const tw = workRecords.reduce((s, r) => s + (parseFloat(r.work_cost) || 0), 0);
            const tm = workRecords.reduce((s, r) => s + (parseFloat(r.material_cost) || 0), 0);
            const grandTotal = tw + tm;
            
            getEl('totalWorkCost').textContent = tw.toFixed(0) + ' €';
            getEl('totalMaterialCost').textContent = tm.toFixed(0) + ' €';
            getEl('totalSum').textContent = grandTotal.toFixed(0) + ' €';
            getEl('mobileGrandTotal').textContent = grandTotal.toFixed(0) + ' €';
        }

        function renderAll() {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
                pendingRender = true;
                return;
            }
            pendingRender = false;

            const cardsContainer = getEl('cardsContainer');
            if (!cardsContainer) return;
            
            cardsContainer.innerHTML = '';
            workRecords.forEach((rec, index) => {
                const cardTotal = (parseFloat(rec.work_cost) || 0) + (parseFloat(rec.material_cost) || 0);
                const photosList = Array.isArray(rec.photo) ? rec.photo : [];
                
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = rec.id;
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-number">#${index + 1}</span>
                        <span style="color:#a0a0a0; font-size:0.8rem;">📅 <input type="date" value="${rec.date || ''}" style="background:transparent; border:none; color:#a0a0a0; width:auto; display:inline;" oninput="updateField(${rec.id}, 'date', this.value)"></span>
                    </div>
                    <div class="card-field"><div class="card-label">🚗 Марка авто</div><input type="text" value="${rec.car_brand || ''}" placeholder="Марка" oninput="updateField(${rec.id}, 'car_brand', this.value)"></div>
                    <div class="card-row">
                        <div class="card-field"><div class="card-label">🧬 VIN</div><input type="text" value="${rec.vin || ''}" placeholder="VIN" style="text-transform:uppercase;" oninput="updateField(${rec.id}, 'vin', this.value)"></div>
                        <div class="card-field"><div class="card-label">🔢 Госномер</div><input type="text" value="${rec.plate_number || ''}" placeholder="Номер" style="text-transform:uppercase;" oninput="updateField(${rec.id}, 'plate_number', this.value)"></div>
                    </div>
                    
                    <div class="card-field">
                        <div class="card-label">📸 Фотографии ремонта</div>
                        <div class="photo-gallery">
                            ${photosList.map((url, pIdx) => `
                                <div class="photo-thumb-wrap">
                                    <img src="${url}" class="photo-thumb" alt="Repair photo">
                                    <button class="photo-delete-btn" onclick="deletePhoto(${rec.id}, ${pIdx})" title="Удалить фото">✕</button>
                                </div>
                            `).join('')}
                            <div class="add-photo-btn" onclick="triggerCamera(${rec.id})" title="Снять фото">
                                📷<span>Камера</span>
                            </div>
                            <div class="add-photo-btn" onclick="triggerGallery(${rec.id})" title="Выбрать из галереи">
                                📁<span>Файлы</span>
                            </div>
                        </div>
                        <input type="file" id="cameraInput_${rec.id}" style="display:none;" accept="image/*" capture="environment" onchange="uploadPhotos(${rec.id}, this)">
                        <input type="file" id="fileInput_${rec.id}" style="display:none;" accept="image/*" multiple onchange="uploadPhotos(${rec.id}, this)">
                    </div>

                    <div class="card-field"><div class="card-label">🔧 Работы</div><textarea rows="2" oninput="updateField(${rec.id}, 'work_description', this.value)">${rec.work_description || ''}</textarea></div>
                    <div class="card-row">
                        <div class="card-field"><div class="card-label">💵 Работа (€)</div><input type="number" value="${rec.work_cost || 0}" oninput="updateField(${rec.id}, 'work_cost', this.value)"></div>
                        <div class="card-field"><div class="card-label">💰 Мат. (€)</div><input type="number" value="${rec.material_cost || 0}" oninput="updateField(${rec.id}, 'material_cost', this.value)"></div>
                    </div>
                    <div class="card-field"><div class="card-label">🔩 Расходники</div><textarea rows="2" oninput="updateField(${rec.id}, 'materials', this.value)">${rec.materials || ''}</textarea></div>
                    <div class="card-field"><div class="card-label">📝 Заметки</div><textarea rows="2" oninput="updateField(${rec.id}, 'notes', this.value)">${rec.notes || ''}</textarea></div>
                    <div class="card-total"><span>💰 Итого по машине:</span><span class="card-total-val">${cardTotal.toFixed(0)}
